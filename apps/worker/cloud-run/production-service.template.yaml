# TiboTattle production origin: the IAM-private Cloud Run service (Knative
# serving.knative.dev/v1).
#
# This file is the single source of truth for the production service spec.
# The GCP infrastructure tooling renders it by plain text substitution and
# applies it; nothing in the repository applies it on its own. The companion
# production-edge-iam.template.json grants run.invoker on this service, and
# production-edge-infra.check.mjs validates both files without a YAML
# dependency.
#
# Syntax: keep to the strict subset the check parses. Use block mappings and
# block sequences, plain identifier or integer scalars, true, and
# single-quoted strings. Every placeholder sits inside a single-quoted
# scalar. Rendered values never contain a quote, a newline or a control
# character, so rendering cannot change the document structure.
#
# Placeholders, all required:
#   PROJECT                            GCP project id
#   REGION                             Cloud Run region
#   SERVICE                            Cloud Run service name
#   RUNTIME_SA                         runtime service account email
#   IMAGE_REPOSITORY                   Artifact Registry image path, with no
#                                      tag or digest
#   IMAGE_DIGEST                       64 lowercase hex sha256 image digest
#   SOURCE_COMMIT                      40 lowercase hex source commit
#   SERVICE_HOST                       the service's run.app host name
#   AUDIENCE                           the custom ID-token audience
#   EDGE_INVOKER_SA                    the edge invoker service account email
#   VERIFIER_SA                        the optional verifier service account
#                                      email, or empty for no verifier
#   MAX_INSTANCES                      maximum instance count (see below)
#   TELEMETRY_STORAGE_NAMESPACE        typed telemetry storage namespace
#   PRIMARY_INSTANCE_CONNECTION_NAME   Cloud SQL primary instance
#   PRIMARY_DATABASE, PRIMARY_SCHEMA   primary database and schema
#   LEDGER_INSTANCE_CONNECTION_NAME    Cloud SQL ledger instance
#   LEDGER_DATABASE, LEDGER_SCHEMA     ledger database and schema
#   POSTGRES_IAM_USER                  the runtime's IAM database user
#   GCS_BUCKET_NAME                    the quarantine object bucket
#   GCS_ERASURE_BUCKET_HISTORY_PROOF   the bucket-birth history proof JSON
#   SECRET_VERSION_<NAME>              the pinned Secret Manager version of
#                                      each secret NAME below
#
# The origin boundary accepts only ID tokens whose audience equals AUDIENCE
# and whose email is the edge invoker (or, for plain health and readiness
# GETs, the verifier). Ingress stays 'all' because the Cloudflare edge calls
# the service over the public internet; invoker IAM, not network ingress, is
# the boundary. Never disable the invoker IAM check and never grant
# run.invoker to a public principal.
#
# Secrets come only from Secret Manager through secretKeyRef, with pinned
# versions. The Cloudflare-only edge secrets (the edge client key secret, the
# edge invoker key, the distribution analytics token and every Sparkle value)
# never belong here.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: '${SERVICE}'
  namespace: '${PROJECT}'
  labels:
    cloud.googleapis.com/location: '${REGION}'
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/invoker-iam-disabled: 'false'
    run.googleapis.com/custom-audiences: '["${AUDIENCE}"]'
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '1'
        # Size MAX_INSTANCES against the Cloud SQL connection budget. Every
        # instance holds the production pools (data, ledger, admission and
        # readiness), and a rollout briefly runs old and new revisions
        # together. The infrastructure validator checks the total against
        # max_connections before any apply.
        autoscaling.knative.dev/maxScale: '${MAX_INSTANCES}'
    spec:
      serviceAccountName: '${RUNTIME_SA}'
      containerConcurrency: 40
      timeoutSeconds: 300
      containers:
        # Keep the default TCP startup probe. An HTTP probe carries no
        # invoker token, so the origin boundary would refuse it.
        - image: '${IMAGE_REPOSITORY}@sha256:${IMAGE_DIGEST}'
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: HOST
              value: '0.0.0.0'
            - name: HOST_MODE
              value: production
            - name: HOST_ORIGIN
              value: 'https://${SERVICE_HOST}'
            - name: PUBLIC_ORIGIN
              value: 'https://tibotattle.com'
            - name: DEPLOYMENT_SOURCE_COMMIT
              value: '${SOURCE_COMMIT}'
            - name: EDGE_ORIGIN_MODE
              value: cloudflare-worker-iam
            - name: EDGE_ORIGIN_AUDIENCE
              value: '${AUDIENCE}'
            - name: EDGE_INVOKER_SERVICE_ACCOUNT
              value: '${EDGE_INVOKER_SA}'
            - name: EDGE_ORIGIN_VERIFIER_SERVICE_ACCOUNTS
              value: '${VERIFIER_SA}'
            - name: TELEMETRY_STORAGE_NAMESPACE
              value: '${TELEMETRY_STORAGE_NAMESPACE}'
            - name: PRIMARY_INSTANCE_CONNECTION_NAME
              value: '${PRIMARY_INSTANCE_CONNECTION_NAME}'
            - name: PRIMARY_DATABASE
              value: '${PRIMARY_DATABASE}'
            - name: PRIMARY_SCHEMA
              value: '${PRIMARY_SCHEMA}'
            - name: LEDGER_INSTANCE_CONNECTION_NAME
              value: '${LEDGER_INSTANCE_CONNECTION_NAME}'
            - name: LEDGER_DATABASE
              value: '${LEDGER_DATABASE}'
            - name: LEDGER_SCHEMA
              value: '${LEDGER_SCHEMA}'
            - name: POSTGRES_IAM_USER
              value: '${POSTGRES_IAM_USER}'
            - name: GCS_BUCKET_NAME
              value: '${GCS_BUCKET_NAME}'
            - name: GCS_ERASURE_BUCKET_HISTORY_PROOF
              value: '${GCS_ERASURE_BUCKET_HISTORY_PROOF}'
            # IDENTITY_LINK_SECRET also keys the edge admission replay.
            - name: IDENTITY_LINK_SECRET
              valueFrom:
                secretKeyRef:
                  name: IDENTITY_LINK_SECRET
                  key: '${SECRET_VERSION_IDENTITY_LINK_SECRET}'
            - name: POSTGRES_RATE_LIMIT_SECRET
              valueFrom:
                secretKeyRef:
                  name: POSTGRES_RATE_LIMIT_SECRET
                  key: '${SECRET_VERSION_POSTGRES_RATE_LIMIT_SECRET}'
            - name: ENVELOPE_PUBLIC_JWK
              valueFrom:
                secretKeyRef:
                  name: ENVELOPE_PUBLIC_JWK
                  key: '${SECRET_VERSION_ENVELOPE_PUBLIC_JWK}'
            - name: ENVELOPE_PRIVATE_JWK
              valueFrom:
                secretKeyRef:
                  name: ENVELOPE_PRIVATE_JWK
                  key: '${SECRET_VERSION_ENVELOPE_PRIVATE_JWK}'
            - name: GOOGLE_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: GOOGLE_OIDC_CLIENT_SECRET
                  key: '${SECRET_VERSION_GOOGLE_OIDC_CLIENT_SECRET}'
            - name: APPLE_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: APPLE_PRIVATE_KEY
                  key: '${SECRET_VERSION_APPLE_PRIVATE_KEY}'
  traffic:
    - percent: 100
      latestRevision: true
