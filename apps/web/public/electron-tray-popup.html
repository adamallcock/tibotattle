<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
    <title>TiboTattle</title>
    <link rel="stylesheet" href="./electron-tray-popup.css">
    <script type="module" src="./electron-tray-popup.js" defer></script>
  </head>
  <body data-i18n-root>
    <main class="electron-tray-popup" id="tray-popup" aria-labelledby="tray-popup-title">
      <header class="electron-tray-popup-header">
        <div class="electron-tray-popup-brand">
          <img src="./tibotattle-icon.png" width="29" height="29" alt="" aria-hidden="true">
          <div class="electron-tray-popup-brand-copy">
            <h1 id="tray-popup-title">TiboTattle</h1>
            <p class="electron-tray-popup-freshness" id="tray-popup-freshness" role="status" aria-live="polite">Loading…</p>
          </div>
        </div>
        <button type="button" data-action="more" class="electron-tray-popup-more"
          data-i18n-aria-label="electron.trayPopover.more" aria-label="More actions"
          data-i18n-title="electron.trayPopover.more" title="More actions">⋯</button>
      </header>

      <section class="electron-tray-popup-section" aria-labelledby="allowance-heading">
        <h2 id="allowance-heading" data-i18n="electron.trayPopover.allowance">Allowance</h2>
        <div id="allowance-lanes" class="electron-tray-popup-allowances"></div>
        <p id="allowance-unavailable" class="electron-tray-popup-notice" hidden></p>
      </section>

      <section id="pace-section" class="electron-tray-popup-section electron-tray-popup-pace" aria-labelledby="pace-heading" hidden>
        <h2 id="pace-heading" data-i18n="electron.trayPopover.weeklyPace">Weekly pace</h2>
        <div class="electron-tray-popup-pace-heading">
          <p id="pace-state"></p>
          <p id="pace-outlook" class="electron-tray-popup-muted"></p>
        </div>
        <div id="pace-metrics" class="electron-tray-popup-pace-metrics">
          <span id="pace-used"></span>
          <span id="pace-remaining"></span>
          <span id="pace-rate"></span>
          <span id="pace-reset"></span>
        </div>
        <div id="pace-track" class="electron-tray-popup-pace-track">
          <span id="pace-fill" class="electron-tray-popup-pace-fill"></span>
          <span id="pace-active-marker" class="electron-tray-popup-pace-active-marker" aria-hidden="true"></span>
        </div>
      </section>

      <section class="electron-tray-popup-section" aria-labelledby="history-heading">
        <div class="electron-tray-popup-section-heading">
          <h2 id="history-heading" data-i18n="electron.trayPopover.localUsage">Local usage</h2>
          <div class="electron-tray-popup-range" role="group"
            data-i18n-aria-label="electron.trayPopover.localUsage"
            aria-label="Local usage">
            <button type="button" data-history-range="7d" aria-pressed="true">7d</button>
            <button type="button" data-history-range="30d" aria-pressed="false">30d</button>
          </div>
        </div>
        <p id="history-retained" class="electron-tray-popup-muted electron-tray-popup-history-retained" hidden></p>
        <div id="history-available">
          <p id="history-period" class="electron-tray-popup-history-period"></p>
          <div class="electron-tray-popup-history-metrics">
            <strong id="history-tokens"></strong>
            <span id="history-events"></span>
          </div>
          <p id="history-price" class="electron-tray-popup-history-price"></p>
          <div id="history-bars" class="electron-tray-popup-history-bars" role="group"
            data-i18n-aria-label="electron.trayPopover.localUsage"
            aria-label="Local usage"></div>
          <div class="electron-tray-popup-history-endpoints" aria-hidden="true">
            <span id="history-start"></span>
            <span id="history-end"></span>
          </div>
          <p id="history-coverage" class="electron-tray-popup-muted" hidden></p>
        </div>
        <div id="history-unavailable" class="electron-tray-popup-history-unavailable" hidden>
          <p id="history-unavailable-title"></p>
          <p id="history-unavailable-body" class="electron-tray-popup-muted"></p>
        </div>
      </section>

      <footer class="electron-tray-popup-footer">
        <div class="electron-tray-popup-footer-actions">
          <button type="button" data-action="open" class="electron-tray-popup-primary" data-i18n="electron.tray.open">Open TiboTattle</button>
          <button type="button" data-action="refresh" data-i18n="electron.trayPopover.refresh">Refresh</button>
        </div>
        <p class="electron-tray-popup-disclaimer" data-i18n="electron.trayPopover.notSubscriptionBill">Not a subscription bill</p>
      </footer>
      <div class="sr-only" id="tray-popup-live" role="status" aria-live="polite"></div>
    </main>
  </body>
</html>
