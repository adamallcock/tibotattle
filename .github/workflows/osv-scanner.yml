name: OSV dependency scan

on:
  pull_request:
  push:
    # Restrict push scans to the protected integration branch; branch
    # protection itself remains repository configuration, not workflow state.
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

# No SARIF upload or external writes. Proof refusal and vulnerability reporting
# fail the same check; expiry must never turn into a successful skipped scan.
permissions:
  contents: read

jobs:
  osv:
    name: Scan committed dependency locks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.2.0
          check-latest: false
          package-manager-cache: false
      - name: Install exact locked dependencies without scripts
        run: |
          npm install --global corepack@0.34.0 --force --ignore-scripts
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          test "$(pnpm --version)" = "11.9.0"
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Refuse expired or changed temporary exception
        run: |
          node scripts/check-http-cache-exception.mjs
          node --test test/http-cache-semantics-security.test.js test/electron-windows-production-signing.test.js test/http-cache-exception.test.js
      # These exact scanner/reporter pins are the actions used by the previous
      # pinned reusable workflow. The proof and scan share one failing check.
      - name: Run scanner
        uses: google/osv-scanner-action/osv-scanner-action@baa4139e56d6312335d899e6ba045fa16d1d3d0b # v2.5.1
        env:
          GOTOOLCHAIN: auto
        with:
          scan-args: |-
            --output=results.json
            --format=json
            --recursive
            ./
      - name: Run vulnerability reporter
        uses: google/osv-scanner-action/osv-reporter-action@baa4139e56d6312335d899e6ba045fa16d1d3d0b # v2.5.1
        with:
          scan-args: |-
            --output=results.sarif
            --new=results.json
            --gh-annotations=false
            --fail-on-vuln=true
