name: OSV dependency scan

on:
  pull_request:
  push:
    # Restrict push scans to the protected integration branch; branch
    # protection itself remains repository configuration, not workflow state.
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

# No SARIF upload or external writes. Dependency proof refusal and vulnerability
# reporting fail the same check; no advisory suppression or successful skip.
permissions:
  contents: read

jobs:
  osv:
    name: Scan committed dependency locks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.2.0
          check-latest: false
          package-manager-cache: false
      - name: Install exact locked dependencies without scripts
        run: |
          npm install --global corepack@0.34.0 --force --ignore-scripts
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          test "$(pnpm --version)" = "11.9.0"
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify the reviewed downloader and removed dependency chains
        run: |
          node scripts/check-build-download-dependencies.mjs
          node --test --test-concurrency=1 test/build-download-dependencies.test.js test/electron-build-downloader.test.js test/electron-windows-production-signing.test.js test/dependency-scan-workflow.test.mjs
      # The reviewed binary digest fixes executable bytes. Direct invocation
      # preserves vulnerability, no-package, config and operational failures.
      - name: Run scanner
        shell: bash
        run: |
          set -euo pipefail
          scanner="${RUNNER_TEMP}/osv-scanner-2.5.1"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 --connect-timeout 15 --max-time 120 \
            https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64 \
            --output "$scanner"
          printf '%s  %s\n' 'f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be' "$scanner" | sha256sum --check --strict
          chmod 0700 "$scanner"
          "$scanner" scan source --all-vulns --recursive ./
