name: OSV dependency scan

on:
  pull_request:
  push:
    # Restrict push scans to the protected integration branch; branch
    # protection itself remains repository configuration, not workflow state.
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

# The scanner reports in the job log and fails on vulnerabilities. SARIF
# upload stays disabled via the upload-sarif input, but the called reusable
# workflow DECLARES actions:read + security-events:write at its top level,
# and GitHub refuses at startup ("No jobs were run") when a caller grants
# less than the callee declares — every run since this file landed failed
# that way. The grants below match the declaration; with upload-sarif false
# nothing is ever written to security-events.
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  osv:
    name: Scan committed dependency locks
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      upload-sarif: false
      fail-on-vuln: true
      scan-args: |-
        --recursive
        ./
