name: Linux final AppImage installed lifecycle
run-name: Linux final artifact qualification (${{ github.sha }})
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate intake only or run the isolated exact-byte native lifecycle
        type: choice
        options: [plan, execute]
        default: plan
        required: true
      intake:
        description: Closed final-artifact intake including original sourceCandidate and exact successful package run and byte identities
        type: string
        required: true
      confirmation:
        description: Execute requires RUN_DISPOSABLE_FINAL_LINUX_LIFECYCLE
        type: string
permissions:
  contents: read
concurrency:
  group: electron-linux-final-qualification
  cancel-in-progress: false
jobs:
  qualify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    env:
      LINUX_FINAL_INTAKE: ${{ inputs.intake }}
      SELECTED_MODE: ${{ inputs.mode }}
      SELECTED_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Check out exact reviewed runner descendant
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned native Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.2.0
          architecture: x64
          check-latest: false
          package-manager-cache: false
      - name: Admit exact source package and runner before downloads
        run: node scripts/qualify-electron-linux-installed-lifecycle.mjs --preflight
      - name: Require native x64 and an actual FUSE device
        if: inputs.mode == 'execute'
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test -c /dev/fuse
          node -e "if(process.version!=='v26.2.0'||process.platform!=='linux'||process.arch!=='x64')process.exit(1)"
      - name: Install only locked verification dependencies
        if: inputs.mode == 'execute'
        run: |
          set -euo pipefail
          npm install --global corepack@0.34.0 --force --ignore-scripts
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Check closed intake and archive refusal contracts
        if: inputs.mode == 'execute'
        run: node --test test/electron-linux-installed-lifecycle.test.js test/electron-linux-installed-files.test.mjs test/electron-linux-real-appimage-updater.test.js
      - name: Download exact public predecessor and successful final package
        if: inputs.mode == 'execute'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/qualify-electron-linux-installed-lifecycle.mjs --acquire
      - name: Inspect final bytes without rebuilding application source
        if: inputs.mode == 'execute'
        run: node scripts/qualify-electron-linux-installed-lifecycle.mjs --prepare
      - name: Build isolated qualification environment only
        if: inputs.mode == 'execute'
        env:
          QUALIFICATION_RUNNER: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/build-electron-linux-container.mjs --architecture amd64
          docker build --platform=linux/amd64 --file containers/electron-linux-installed/Dockerfile \
            --build-arg "TIBOTATTLE_QUALIFICATION_REVISION=$QUALIFICATION_RUNNER" \
            --tag tibotattle-electron-linux-installed:test .
      - name: Exercise ordinary FUSE launcher and complete installed lifecycle offline
        if: inputs.mode == 'execute'
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 .release-build/linux-final-qualification/receipts
          timeout 900s docker run --rm --init --platform=linux/amd64 \
            --name tibotattle-final-linux-qualification \
            --cap-add=SYS_ADMIN --device /dev/fuse --network none \
            --add-host updates.tibotattle.com:127.0.0.1 --shm-size=512m \
            --tmpfs /home/node:rw,noexec,nosuid,size=256m,uid=1000,gid=1000,mode=0700 \
            --tmpfs /run/user/1000:rw,noexec,nosuid,size=256m,uid=1000,gid=1000,mode=0700 \
            --tmpfs /opt/tibotattle-updater-exec:rw,exec,nosuid,size=768m,uid=1000,gid=1000,mode=0700 \
            --env HOME=/home/node --env TMPDIR=/run/user/1000 \
            --env XDG_RUNTIME_DIR=/run/user/1000 \
            --env XDG_CONFIG_HOME=/home/node/.config \
            --env XDG_CACHE_HOME=/home/node/.cache \
            --env XDG_DATA_HOME=/home/node/.local/share \
            --env TIBOTATTLE_LINUX_SECRET_SERVICE_ISOLATED=1 \
            --env USAGE_MONITOR_LINUX_IMAGE_PLATFORM=linux/amd64 \
            --env USAGE_MONITOR_LINUX_NETWORK_BOUNDARY=network-none \
            tibotattle-electron-linux-installed:test \
            > .release-build/linux-final-qualification/receipts/installed-lifecycle.json
          test -z "$(docker ps -aq --filter name=^/tibotattle-final-linux-qualification$)"
      - name: Remove only the named disposable runtime after interruption
        if: always() && inputs.mode == 'execute'
        run: |
          set -euo pipefail
          if test -n "$(docker ps -aq --filter name=^/tibotattle-final-linux-qualification$)"; then
            docker rm --force tibotattle-final-linux-qualification >/dev/null
          fi
      - name: Retain content-free exact-byte evidence
        if: always() && inputs.mode == 'execute'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: electron-linux-final-qualification-${{ github.run_id }}
          path: |
            .release-build/linux-final-qualification/pair.json
            .release-build/linux-final-qualification/receipts/*.json
          if-no-files-found: error
          retention-days: 14
