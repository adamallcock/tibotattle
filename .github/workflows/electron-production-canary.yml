name: Electron production synthetic canary
on:
  push:
    branches: [codex/unified-desktop-accountless]
  workflow_dispatch:
    inputs:
      mode:
        description: Plan verifies bytes only; execute requires separate production approval
        type: choice
        options: [plan, execute]
        default: plan
        required: true
      runner_revision:
        description: Exact reviewed workflow commit
        type: string
        required: true
      source_revision:
        description: Exact signed application source commit
        type: string
        required: true
      archive_url:
        description: Approved normal Mac test ZIP on the fixed update host
        type: string
        required: true
      archive_sha256:
        description: Exact approved ZIP SHA-256
        type: string
        required: true
      asar_sha256:
        description: Exact approved ASAR SHA-256
        type: string
        required: true
      cleanup_public_key_base64:
        description: One-run RSA-4096 public PEM encoded as base64; never a private key
        type: string
        required: true
      cleanup_public_key_sha256:
        description: SHA-256 of the decoded public PEM
        type: string
        required: true
      confirmation:
        description: Execute only after approval with RUN_ONE_SYNTHETIC_PRODUCTION_CANARY
        type: string
permissions:
  contents: read
concurrency:
  group: electron-production-synthetic-canary
  cancel-in-progress: false
jobs:
  registration:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Register the manual canary workflow without executing it
        run: echo "Production canary requires a separately approved manual dispatch."
  canary:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      SELECTED_MODE: ${{ inputs.mode }}
      SELECTED_RUNNER: ${{ inputs.runner_revision }}
      SELECTED_SOURCE: ${{ inputs.source_revision }}
      SELECTED_URL: ${{ inputs.archive_url }}
      SELECTED_ARCHIVE: ${{ inputs.archive_sha256 }}
      SELECTED_ASAR: ${{ inputs.asar_sha256 }}
      CLEANUP_PUBLIC_KEY: ${{ inputs.cleanup_public_key_base64 }}
      CLEANUP_KEY_SHA256: ${{ inputs.cleanup_public_key_sha256 }}
      EXECUTION_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Check out the exact reviewed runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.2.0
          architecture: arm64
          package-manager-cache: false
      - name: Install locked verification dependencies
        run: |
          npm install --global corepack@0.34.0 --force --ignore-scripts
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Intake the approved normal signed artifact and public cleanup key
        run: |
          umask 077
          mkdir -m 700 canary-receipts
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,posixpath,re,stat,subprocess,zipfile
          e=os.environ; runner=e['SELECTED_RUNNER']; source=e['SELECTED_SOURCE']
          digest=e['SELECTED_ARCHIVE']; asar=e['SELECTED_ASAR']; key_digest=e['CLEANUP_KEY_SHA256']
          assert re.fullmatch('[0-9a-f]{40}',runner) and runner==e['GITHUB_SHA']
          assert re.fullmatch('[0-9a-f]{40}',source)
          assert all(re.fullmatch('[0-9a-f]{64}',v) for v in [digest,asar,key_digest])
          assert e['SELECTED_MODE'] in ['plan','execute']
          assert e['EXECUTION_CONFIRMATION']==('RUN_ONE_SYNTHETIC_PRODUCTION_CANARY' if e['SELECTED_MODE']=='execute' else '')
          url=e['SELECTED_URL']
          # One reviewed archive only. Inputs bind approval; they do not select arbitrary signed payloads.
          assert source=='178315c49f432c8c1ed84f8c982d1c57aed8a094'
          assert digest=='b85988831c5d0efd5750ed027e651d29942c268158949f76f9e497ef26f81f6b'
          assert asar=='d850f0b13ba116b43b36c4e6a5fedabdfe25af35b072dd7b0b5d7fd535319dc3'
          assert url=='https://updates.tibotattle.com/electron/rehearsal/native-to-electron-handover-v1/production-canary/178315c49f432c8c1ed84f8c982d1c57aed8a094/b85988831c5d0efd5750ed027e651d29942c268158949f76f9e497ef26f81f6b.zip'
          assert re.fullmatch(r'https://updates\.tibotattle\.com/electron/rehearsal/native-to-electron-handover-v1/production-canary/[0-9a-f]{40}/[0-9a-f]{64}\.zip',url)
          key=base64.b64decode(e['CLEANUP_PUBLIC_KEY'],validate=True)
          assert len(key)<=16384 and key.startswith(b'-----BEGIN PUBLIC KEY-----\n') and hashlib.sha256(key).hexdigest()==key_digest
          root=pathlib.Path(e['RUNNER_TEMP'])/'production-canary-intake';root.mkdir(mode=0o700)
          (root/'cleanup-public.pem').write_bytes(key)
          archive=root/'app.zip'
          result=subprocess.run(['/usr/bin/curl','--disable','--fail','--silent','--show-error','--proto','=https',
            '--max-time','120','--max-filesize',str(1024**3),'--output',str(archive),'--write-out','%{http_code}',url],
            capture_output=True,text=True,check=True,timeout=130)
          assert result.stdout=='200' and archive.stat().st_size<=1024**3
          with archive.open('rb') as stream: assert hashlib.file_digest(stream,'sha256').hexdigest()==digest
          with zipfile.ZipFile(archive) as z:
            entries=z.infolist()
            assert len(entries)<20000 and sum(v.file_size for v in entries)<3*1024**3
            assert len({v.filename for v in entries})==len(entries)
            for item in entries:
              path=pathlib.PurePosixPath(item.filename); mode=stat.S_IFMT(item.external_attr>>16)
              assert not path.is_absolute() and '..' not in path.parts and path.parts[0]=='TiboTattle.app'
              assert mode in [0,stat.S_IFREG,stat.S_IFDIR,stat.S_IFLNK]
              if mode==stat.S_IFLNK:
                assert item.file_size<4096
                target=z.read(item).decode('utf-8')
                normalized=posixpath.normpath(posixpath.join(str(path.parent),target))
                assert not target.startswith('/') and normalized.startswith('TiboTattle.app/')
          extracted=root/'verified';extracted.mkdir(mode=0o700)
          subprocess.run(['/usr/bin/ditto','-x','-k',str(archive),str(extracted)],check=True,timeout=120)
          pathlib.Path('canary-receipts/intake.json').write_text(json.dumps({'runnerRevision':runner,'sourceRevision':source,
            'archiveUrl':url,'archiveSha256':digest,'asarSha256':asar,'cleanupKeySha256':key_digest,'archiveVerified':True})+'\n')
          PY
      - name: Verify or execute the approved single synthetic source
        run: |
          umask 077
          args=(--plan)
          if [[ "$SELECTED_MODE" == execute ]]; then
            args=(--execute-production-canary --confirm "$EXECUTION_CONFIRMATION")
          fi
          node scripts/run-signed-electron-production-canary.mjs "${args[@]}" \
            --app "$RUNNER_TEMP/production-canary-intake/verified/TiboTattle.app" \
            --source-revision "$SELECTED_SOURCE" --asar-sha256 "$SELECTED_ASAR" \
            --cleanup-public-key "$RUNNER_TEMP/production-canary-intake/cleanup-public.pem" \
            --cleanup-public-key-sha256 "$CLEANUP_KEY_SHA256" > canary-receipts/execution.json
      - name: Retain closed evidence and encrypted owner cleanup target only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-canary-evidence-${{ github.run_id }}
          path: |
            canary-receipts/*.json
            ${{ runner.temp }}/production-canary-evidence/cleanup-target.encrypted.json
          if-no-files-found: error
          retention-days: 14
