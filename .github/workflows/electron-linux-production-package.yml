name: Electron Linux production package
run-name: Linux package (${{ inputs.source_revision }})

on:
  # Harmless registration only; native packaging remains manual.
  push:
    branches: [codex/unified-desktop-accountless]
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact immutable dispatch source revision to package
        required: true
        type: string
      build_number:
        description: Approved positive release build number
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: electron-linux-production-package
  cancel-in-progress: false

jobs:
  registration:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Register manual packaging only
        run: printf '%s\n' 'LINUX_PRODUCTION_PACKAGE_REGISTERED'
  package:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      CI: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      SOURCE_REVISION: ${{ inputs.source_revision }}
      EXPECTED_DISPATCH_SHA: ${{ github.sha }}
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - name: Check out exact dispatch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Bind requested source and build number
        run: |
          set -euo pipefail
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          test "$SOURCE_REVISION" = "$EXPECTED_DISPATCH_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Set up pinned native Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.2.0
          architecture: x64
          check-latest: false
          package-manager-cache: false
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          node -e "if(process.version!=='v26.2.0'||process.platform!=='linux'||process.arch!=='x64')process.exit(1)"
          npm install --global corepack@0.34.0 --force --ignore-scripts
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          test "$(pnpm --version)" = "11.9.0"
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Install existing Linux package prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libsecret-1-0 libsecret-1-dev pkg-config libarchive-tools libfuse2t64
      - name: Build and qualify the native Linux credential mutex
        run: |
          set -euo pipefail
          node_gyp_script="$(npm root --global)/npm/node_modules/node-gyp/bin/node-gyp.js"
          test -f "$node_gyp_script"
          node "$node_gyp_script" rebuild --directory native/linux-credential-mutex
          node scripts/stage-linux-credential-mutex-binding.mjs
          node scripts/build-linux-credential-mutex-manifest.mjs
          node scripts/qualify-linux-credential-mutex.mjs
      - name: Validate packaging contracts
        run: node --test test/electron-production-distribution.test.js test/electron-linux-production-package-workflow.test.js
      - name: Prepare normal production source
        run: |
          set -euo pipefail
          node scripts/package-electron-production.mjs --target linux-x64 \
            --source-revision "$SOURCE_REVISION" --build-number "$BUILD_NUMBER" --replace-staging
      - name: Package exact receipt and bind final AppImage bytes
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile,writeFile,readdir} from 'node:fs/promises';
          import {spawnSync} from 'node:child_process';
          import {createRequire} from 'node:module';
          import {createHash} from 'node:crypto';
          import {productionElectronCandidatePlan} from './scripts/package-electron-production.mjs';
          import {linuxAppImageIdentity} from './scripts/build-linux-updater-rehearsal.mjs';
          import {parseWindowsUpdaterYaml} from './scripts/verify-electron-windows-update-artifacts.mjs';
          const require=createRequire(import.meta.url), root='.release-build/electron-production/linux-x64';
          const receiptBytes=await readFile(`${root}/production-source-candidate.json`);
          const receipt=JSON.parse(receiptBytes);
          const plan=productionElectronCandidatePlan({target:'linux-x64',sourceRevision:process.env.SOURCE_REVISION,buildNumber:process.env.BUILD_NUMBER,hostPlatform:process.platform,hostArchitecture:process.arch});
          assert.deepEqual(receipt,{...plan,status:'production_source_staged',stagedManifest:'app/package.json',runtimeManifest:'app/electron-runtime-manifest.json'});
          assert.deepEqual(receipt.builderArguments,['--linux','AppImage','--x64','--publish','never']);
          assert.equal(receipt.builderConfiguration,'apps/electron/electron-builder.production.config.cjs');
          const build=spawnSync(process.execPath,[require.resolve('electron-builder/cli.js'),'--config',receipt.builderConfiguration,...receipt.builderArguments],{env:{...process.env,...receipt.builderEnvironment},shell:false,stdio:'inherit',timeout:1200000});
          assert.equal(build.error,undefined);assert.equal(build.status,0);
          const artifactName=`TiboTattle-${receipt.version}-linux-x64.AppImage`;
          const images=(await readdir(receipt.artifactDirectory)).filter(n=>n.endsWith('.AppImage'));
          assert.deepEqual(images,[artifactName]);
          const image=await linuxAppImageIdentity(`${receipt.artifactDirectory}/${artifactName}`);
          const manifestBytes=await readFile(`${receipt.artifactDirectory}/latest-linux.yml`);
          const manifest=parseWindowsUpdaterYaml(manifestBytes);
          assert.equal(manifest.version,receipt.version);assert.equal(manifest.path,artifactName);assert.equal(manifest.sha512,image.sha512);
          assert.equal(manifest.files.length,1);assert.deepEqual(manifest.files[0],{url:artifactName,sha512:image.sha512,size:image.bytes});
          assert.equal(Object.hasOwn(manifest,'packages'),false);
          const appUpdateBytes=await readFile(`${receipt.artifactDirectory}/linux-unpacked/resources/app-update.yml`);
          const appUpdate=parseWindowsUpdaterYaml(appUpdateBytes);
          assert.equal(appUpdate.provider,'generic');assert.equal(appUpdate.url,receipt.updateFeed);
          assert.ok(Object.keys(appUpdate).every(k=>['provider','url','updaterCacheDirName'].includes(k)));
          await writeFile(`${root}/app-update.yml`,appUpdateBytes,{flag:'wx',mode:0o600});
          const hash=bytes=>createHash('sha256').update(bytes).digest('hex');
          const proof={schemaVersion:'tibotattle-linux-production-package-v1',sourceRevision:receipt.sourceRevision,version:receipt.version,buildNumber:receipt.buildNumber,target:receipt.target,sourceCandidateSha256:hash(receiptBytes),appUpdate:{file:'app-update.yml',bytes:appUpdateBytes.length,sha256:hash(appUpdateBytes)},artifact:{file:artifactName,...image},manifest:{file:'latest-linux.yml',bytes:manifestBytes.length,sha256:hash(manifestBytes)},signingRequired:false,published:false,nativeRuntimeQualification:'separate_evidence_required'};
          await writeFile(`${root}/linux-production-package-receipt.json`,JSON.stringify(proof,null,2)+'\n',{flag:'wx',mode:0o600});
          console.log('LINUX_PRODUCTION_PACKAGE_BYTES_VERIFIED');
          NODE
      - name: Retain final package and exact source evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: electron-linux-production-package-${{ github.sha }}
          path: |
            .release-build/electron-production/linux-x64/artifacts/*.AppImage
            .release-build/electron-production/linux-x64/artifacts/latest-linux.yml
            .release-build/electron-production/linux-x64/production-source-candidate.json
            .release-build/electron-production/linux-x64/app-update.yml
            .release-build/electron-production/linux-x64/linux-production-package-receipt.json
          if-no-files-found: error
          retention-days: 14
