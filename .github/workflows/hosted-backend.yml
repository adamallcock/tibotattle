name: Hosted backend

# Source-level CI for all ten hosted-backend jobs: three disjoint Worker
# producers and their required aggregate, the Cloud Run host check with its
# offline production-tooling checks, a focused activation-producer regression,
# and every apps/worker/postgres-test spec against PostgreSQL 17 in its routed
# environment profile.
#
# PostgreSQL 17 is the official postgres image pinned by digest in
# apps/worker/scripts/ci-postgres-container.mjs, run as the runner uid with a
# private 0700 socket directory. The PGDG apt fallback documented there is not
# in use.
#
# Execution jobs use Node.js 26.2.0. The three partitioned PostgreSQL producers
# also install Node.js 22.16.0, the Cloud Run image runtime, and name it to the
# receipt producer as EDGE_E2E_NODE. EDGE_E2E runs the Cloud Run origin under
# that image runtime. Those three producers install 22.16.0 first and 26.2.0
# last, so `node` on PATH and the suite stay on 26.2.0. EDGE_E2E's seeding
# rehearsal needs that newer node:sqlite. The workflow policy allows 22.16.0
# here only.
#
# Every execution job installs the root, Worker and Cloud Run lockfiles. The
# Worker analytics/fast-path stage imports apps/worker/cloud-run modules, which
# need @google-cloud/cloud-sql-connector. The Worker gate aggregate is tool-free.
#
# Skip enforcement is machine-checked only for apps/worker/postgres-test: the
# partition jobs fail on any skipped or todo test there, and on an environment
# gap such as a missing EDGE_E2E_NODE or EDGE_E2E_GOLDEN. The Worker producer
# stages and Cloud Run check run their own PostgreSQL-gated checks (for example
# apps/worker/scripts/postgres-*.check.mjs and apps/worker/cloud-run/*.check.mjs)
# with the SOCKET profile exported, but a skip inside those checks is reported
# by node:test without failing the job. The focused activation producer runner
# applies the same TAP parser with zero-skip enforcement to its fixed files.
#
# The Cloud Run check also runs the offline parts of
# gcp:production-tooling:local-check (the rollout CLI, the cutover barrier
# capture, the infrastructure manifest and the cutover seal), which need no
# PostgreSQL, network or credential. It checks out full history, because the
# cutover seal check reads pinned commits as git objects; it fails, and never
# skips, when they are absent. The three PostgreSQL partition producers and the
# focused activation producer check out full history; READ-EXPANSION specs in
# the partitioned jobs archive their pinned base commit. The
# Worker runtime-test stage also checks out full history for immutable
# vendored-kernel source, facade and transition verification. The PostgreSQL-
# backed part of gcp:production-tooling:local-check,
# postgres-production-migrations.spec.mjs and
# github-distribution-manifest-visibility.spec.mjs runs in a CORE shard.
# The postgres-17-suite aggregate verifies exact same-run receipts, source/runtime
# provenance, equal generated build inputs across CORE_A and CORE_B, complete
# disjoint coverage, and success of the focused activation-producer job. The
# Worker gate aggregate requires all three Worker stages to succeed with
# matching source SHA, run ID and attempt.
# PR jobs explicitly select the actual pull-request head, not the provider
# synthetic merge revision. Push and dispatch jobs select github.sha. All
# producer provenance binds that same selected source; GITHUB_SHA remains
# unchanged.
#
# Read-only by construction: no secrets, no environments, no deployment, no
# remote database or Cloudflare writes. A green run proves these source gates on
# this commit only; it is not deployment, migration or release evidence.
#
# The path filters are the root inputs the gates import (checked by
# test/hosted-backend-workflow.test.js from a static import closure).

on:
  pull_request:
    paths:
      - "apps/worker/**"
      - "apps/web/public/**"
      - "apps/electron/**"
      - "config/**"
      - "native/**"
      - "packages/**"
      - "schemas/**"
      - "scripts/**"
      - "src/**"
      - "test/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/hosted-backend.yml"
  push:
    branches:
      - main
    paths:
      - "apps/worker/**"
      - "apps/web/public/**"
      - "apps/electron/**"
      - "config/**"
      - "native/**"
      - "packages/**"
      - "schemas/**"
      - "scripts/**"
      - "src/**"
      - "test/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/hosted-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-foundation:
    name: Worker foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      WRANGLER_SEND_METRICS: "false"
    outputs:
      source_sha: ${{ steps.report-worker-stage.outputs.source_sha }}
      run_id: ${{ steps.report-worker-stage.outputs.run_id }}
      run_attempt: ${{ steps.report-worker-stage.outputs.run_attempt }}
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.2.0
          check-latest: false
          package-manager-cache: false

      - name: Install locked root, Worker and Cloud Run dependencies
        run: |
          set -euo pipefail
          npm install --global corepack@0.34.0 --force --ignore-scripts
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          test "$(node --version)" = "v26.2.0"
          test "$(pnpm --version)" = "11.9.0"
          pnpm install --frozen-lockfile --ignore-scripts
          npm --prefix apps/worker ci
          npm --prefix apps/worker/cloud-run ci

      - name: Create the private PostgreSQL socket root
        run: |
          set -euo pipefail
          sudo mkdir -p /private/tmp
          sudo chmod 1777 /private/tmp

      - name: Start PostgreSQL 17 and export the SOCKET profile
        run: node apps/worker/scripts/ci-postgres-container.mjs --export-socket-profile

      - name: Assert the selected source before running this stage
        env:
          CI_WORKER_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$CI_WORKER_EXPECTED_HEAD"

      - name: Check this workflow's contract, migration numbering and PostgreSQL suite routing
        run: node --test test/hosted-backend-workflow.test.js apps/worker/scripts/migration-numbering.check.mjs apps/worker/scripts/ci-postgres-suite.check.mjs

      - name: Run the Worker foundation checks
        run: npm --prefix apps/worker run check:foundation

      - name: Stop PostgreSQL 17
        if: always()
        run: node apps/worker/scripts/ci-postgres-container.mjs --stop

      - name: Report successful Worker stage provenance
        id: report-worker-stage
        env:
          CI_WORKER_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CI_WORKER_EXPECTED_HEAD"
          printf 'source_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'run_id=%s\n' "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
  worker-runtime-tests:
    name: Worker runtime tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      WRANGLER_SEND_METRICS: "false"
    outputs:
      source_sha: ${{ steps.report-worker-stage.outputs.source_sha }}
      run_id: ${{ steps.report-worker-stage.outputs.run_id }}
      run_attempt: ${{ steps.report-worker-stage.outputs.run_attempt }}
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.2.0
          check-latest: false
          package-manager-cache: false

      - name: Install locked root, Worker and Cloud Run dependencies
        run: |
          set -euo pipefail
          npm install --global corepack@0.34.0 --force --ignore-scripts
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          test "$(node --version)" = "v26.2.0"
          test "$(pnpm --version)" = "11.9.0"
          pnpm install --frozen-lockfile --ignore-scripts
          npm --prefix apps/worker ci
          npm --prefix apps/worker/cloud-run ci

      - name: Create the private PostgreSQL socket root
        run: |
          set -euo pipefail
          sudo mkdir -p /private/tmp
          sudo chmod 1777 /private/tmp

      - name: Start PostgreSQL 17 and export the SOCKET profile
        run: node apps/worker/scripts/ci-postgres-container.mjs --export-socket-profile

      - name: Assert the selected source before running this stage
        env:
          CI_WORKER_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$CI_WORKER_EXPECTED_HEAD"

      - name: Run the Worker runtime tests and identity checks
        run: npm --prefix apps/worker run check:runtime-tests

      - name: Stop PostgreSQL 17
        if: always()
        run: node apps/worker/scripts/ci-postgres-container.mjs --stop

      - name: Report successful Worker stage provenance
        id: report-worker-stage
        env:
          CI_WORKER_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CI_WORKER_EXPECTED_HEAD"
          printf 'source_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'run_id=%s\n' "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
  worker-analytics-fastpath:
    name: Worker analytics and staging checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      WRANGLER_SEND_METRICS: "false"
    outputs:
      source_sha: ${{ steps.report-worker-stage.outputs.source_sha }}
      run_id: ${{ steps.report-worker-stage.outputs.run_id }}
      run_attempt: ${{ steps.report-worker-stage.outputs.run_attempt }}
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.2.0
          check-latest: false
          package-manager-cache: false

      - name: Install locked root, Worker and Cloud Run dependencies
        run: |
          set -euo pipefail
          npm install --global corepack@0.34.0 --force --ignore-scripts
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          test "$(node --version)" = "v26.2.0"
          test "$(pnpm --version)" = "11.9.0"
          pnpm install --frozen-lockfile --ignore-scripts
          npm --prefix apps/worker ci
          npm --prefix apps/worker/cloud-run ci

      - name: Create the private PostgreSQL socket root
        run: |
          set -euo pipefail
          sudo mkdir -p /private/tmp
          sudo chmod 1777 /private/tmp

      - name: Start PostgreSQL 17 and export the SOCKET profile
        run: node apps/worker/scripts/ci-postgres-container.mjs --export-socket-profile

      # gcp:fastpath:prod-shape:check runs real zsh process-control harnesses
      # and a local refresh child under GNU /usr/bin/time on this Linux runner.
      - name: Install and verify measurement check prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zsh time
          zsh -c 'zmodload zsh/datetime; [[ -n "$EPOCHREALTIME" ]]'
          test -x /usr/bin/time
          [[ "$(/usr/bin/time --version)" == *"GNU Time"* ]]
          /usr/bin/time -f '%e %U %S %M' /bin/true

      # deploy:dry and staging:check stage production assets from a generated
      # public release site. Build one locally with a synthetic 1200x630 card.
      - name: Build a synthetic public release site for the dry-run asset stage
        run: |
          set -euo pipefail
          social_card="$RUNNER_TEMP/hosted-backend-social-card.png"
          node --input-type=module --eval '
            import { crc32, deflateSync } from "node:zlib";
            import { writeFileSync } from "node:fs";
            function chunk(type, data) {
              const length = Buffer.alloc(4);
              length.writeUInt32BE(data.length);
              const body = Buffer.concat([Buffer.from(type, "ascii"), data]);
              const crc = Buffer.alloc(4);
              crc.writeUInt32BE(crc32(body) >>> 0);
              return Buffer.concat([length, body, crc]);
            }
            const width = 1200;
            const height = 630;
            const header = Buffer.alloc(13);
            header.writeUInt32BE(width, 0);
            header.writeUInt32BE(height, 4);
            header[8] = 8;
            writeFileSync(process.argv[1], Buffer.concat([
              Buffer.from([0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a]),
              chunk("IHDR", header),
              chunk("IDAT", deflateSync(Buffer.alloc((width + 1) * height))),
              chunk("IEND", Buffer.alloc(0)),
            ]));
          ' "$social_card"
          node scripts/build-public-release-site.js \
            --output "$GITHUB_WORKSPACE/.release-build/public-release-site" \
            --site-url https://tibotattle.com/ \
            --release-notes-url https://tibotattle.com/docs.html \
            --privacy-url https://tibotattle.com/privacy.html \
            --security-url https://tibotattle.com/docs.html \
            --support-url https://tibotattle.com/docs.html \
            --social-image "$social_card" > /dev/null

      - name: Assert the selected source before running this stage
        env:
          CI_WORKER_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$CI_WORKER_EXPECTED_HEAD"

      - name: Run the Worker analytics, fast-path and staging checks
        run: npm --prefix apps/worker run check:analytics-fastpath

      - name: Stop PostgreSQL 17
        if: always()
        run: node apps/worker/scripts/ci-postgres-container.mjs --stop

      - name: Report successful Worker stage provenance
        id: report-worker-stage
        env:
          CI_WORKER_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CI_WORKER_EXPECTED_HEAD"
          printf 'source_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'run_id=%s\n' "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
  # A required check-run summary for the three disjoint Worker producers.
  # Re-running only failed jobs cannot combine stage outputs from prior attempts.
  worker-gate:
    name: Worker gate
    needs:
      - worker-foundation
      - worker-runtime-tests
      - worker-analytics-fastpath
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every Worker stage on this exact source, run and attempt
        env:
          CI_WORKER_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_WORKER_FOUNDATION_RESULT: ${{ needs.worker-foundation.result }}
          CI_WORKER_RUNTIME_RESULT: ${{ needs.worker-runtime-tests.result }}
          CI_WORKER_ANALYTICS_RESULT: ${{ needs.worker-analytics-fastpath.result }}
          CI_WORKER_FOUNDATION_HEAD: ${{ needs.worker-foundation.outputs.source_sha }}
          CI_WORKER_RUNTIME_HEAD: ${{ needs.worker-runtime-tests.outputs.source_sha }}
          CI_WORKER_ANALYTICS_HEAD: ${{ needs.worker-analytics-fastpath.outputs.source_sha }}
          CI_WORKER_FOUNDATION_RUN_ID: ${{ needs.worker-foundation.outputs.run_id }}
          CI_WORKER_RUNTIME_RUN_ID: ${{ needs.worker-runtime-tests.outputs.run_id }}
          CI_WORKER_ANALYTICS_RUN_ID: ${{ needs.worker-analytics-fastpath.outputs.run_id }}
          CI_WORKER_FOUNDATION_RUN_ATTEMPT: ${{ needs.worker-foundation.outputs.run_attempt }}
          CI_WORKER_RUNTIME_RUN_ATTEMPT: ${{ needs.worker-runtime-tests.outputs.run_attempt }}
          CI_WORKER_ANALYTICS_RUN_ATTEMPT: ${{ needs.worker-analytics-fastpath.outputs.run_attempt }}
        run: |
          set -euo pipefail
          test "$CI_WORKER_FOUNDATION_RESULT" = "success"
          test "$CI_WORKER_RUNTIME_RESULT" = "success"
          test "$CI_WORKER_ANALYTICS_RESULT" = "success"
          test "$CI_WORKER_FOUNDATION_HEAD" = "$CI_WORKER_EXPECTED_HEAD"
          test "$CI_WORKER_RUNTIME_HEAD" = "$CI_WORKER_EXPECTED_HEAD"
          test "$CI_WORKER_ANALYTICS_HEAD" = "$CI_WORKER_EXPECTED_HEAD"
          test "$CI_WORKER_FOUNDATION_HEAD" = "$CI_WORKER_RUNTIME_HEAD"
          test "$CI_WORKER_RUNTIME_HEAD" = "$CI_WORKER_ANALYTICS_HEAD"
          test "$CI_WORKER_FOUNDATION_RUN_ID" = "$GITHUB_RUN_ID"
          test "$CI_WORKER_RUNTIME_RUN_ID" = "$GITHUB_RUN_ID"
          test "$CI_WORKER_ANALYTICS_RUN_ID" = "$GITHUB_RUN_ID"
          test "$CI_WORKER_FOUNDATION_RUN_ATTEMPT" = "$GITHUB_RUN_ATTEMPT"
          test "$CI_WORKER_RUNTIME_RUN_ATTEMPT" = "$GITHUB_RUN_ATTEMPT"
          test "$CI_WORKER_ANALYTICS_RUN_ATTEMPT" = "$GITHUB_RUN_ATTEMPT"
  cloud-run-check:
    name: Cloud Run check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Full history: the cutover seal check reads pinned commits as git
      # objects (the restore-base generator commit 8da57e76 and its parent, and
      # the Cloudflare production line d43c8f92, which is not an ancestor of
      # this line and arrives with the repository's other branches). It fails
      # as an environment gap without them.
      - name: Check out the selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.2.0
          check-latest: false
          package-manager-cache: false

      - name: Install locked root, Worker and Cloud Run dependencies
        run: |
          set -euo pipefail
          npm install --global corepack@0.34.0 --force --ignore-scripts
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          test "$(node --version)" = "v26.2.0"
          test "$(pnpm --version)" = "11.9.0"
          pnpm install --frozen-lockfile --ignore-scripts
          npm --prefix apps/worker ci
          npm --prefix apps/worker/cloud-run ci

      - name: Create the private PostgreSQL socket root
        run: |
          set -euo pipefail
          sudo mkdir -p /private/tmp
          sudo chmod 1777 /private/tmp

      - name: Start PostgreSQL 17 and export the SOCKET profile
        run: node apps/worker/scripts/ci-postgres-container.mjs --export-socket-profile

      - name: Run the Cloud Run check
        run: npm --prefix apps/worker/cloud-run run check

      # The offline parts of gcp:production-tooling:local-check. Its first
      # component, postgres:production-migrations:check, is already covered: the
      # Cloud Run check runs its offline half, and the postgres-17-suite job runs
      # its PostgreSQL-backed spec.
      - name: Check the production rollout tooling offline
        run: npm --prefix apps/worker run gcp:production-rollout:check

      - name: Check the cutover barrier capture tooling offline
        run: npm --prefix apps/worker run gcp:barrier-capture:check

      - name: Check the infrastructure manifest and operations offline
        run: npm --prefix apps/worker run gcp:ops:infra:check

      - name: Check the cutover seal tooling offline
        run: npm --prefix apps/worker run postgres:cutover-seal:check

      - name: Stop PostgreSQL 17
        if: always()
        run: node apps/worker/scripts/ci-postgres-container.mjs --stop

  postgres-17-core-a:
    name: PostgreSQL 17 CORE_A
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The fast-path cloud-target specs also dial the server over loopback TCP:
    # the container's published 127.0.0.1 port (ciPostgresTcpProfile), which
    # differs from the socket's PG_TEST_PORT. The suite passes this pair to its
    # SOCKET pass only; without it those tests would report as skipped.
    env:
      PG_TEST_TCP_HOST: "127.0.0.1"
      PG_TEST_TCP_PORT: "55432"
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # CORE_A binds the image runtime to its receipt. It goes first so that the
      # repository toolchain installed afterward stays first on PATH.
      - name: Install the Cloud Run image runtime Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          check-latest: false
          package-manager-cache: false

      # CORE_A still binds the image runtime and runs the transfer Q-1 dump case.
      - name: Name the image runtime and the committed Q-1 dump
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.16.0"
          dump="$GITHUB_WORKSPACE/apps/worker/analytics-v2-test/golden/dump/usage-monitor-db.json"
          test -f "$dump"
          {
            printf 'EDGE_E2E_NODE=%s\n' "$(command -v node)"
            printf 'POSTGRES_V12_TRANSFER_Q1_DUMP=%s\n' "$dump"
          } >> "$GITHUB_ENV"

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.2.0
          check-latest: false
          package-manager-cache: false

      # Two specs import Cloud Run host modules, so this job needs its lockfile too.
      - name: Install locked root, Worker and Cloud Run dependencies
        run: |
          set -euo pipefail
          npm install --global corepack@0.34.0 --force --ignore-scripts
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          test "$(node --version)" = "v26.2.0"
          test "$(pnpm --version)" = "11.9.0"
          pnpm install --frozen-lockfile --ignore-scripts
          npm --prefix apps/worker ci
          npm --prefix apps/worker/cloud-run ci

      - name: Create the private PostgreSQL socket root
        run: |
          set -euo pipefail
          sudo mkdir -p /private/tmp
          sudo chmod 1777 /private/tmp

      - name: Start PostgreSQL 17 and export the SOCKET profile
        run: node apps/worker/scripts/ci-postgres-container.mjs --export-socket-profile

      # analytics-v2-refresh's K-PAR spec runs the built analytics-refresh
      # worker bundle, so build the Cloud Run bundles before the suite.
      - name: Build the Cloud Run bundles the suite runs
        run: node apps/worker/cloud-run/build.mjs

      - name: Run the CORE_A partition in its routed profiles with zero skips
        env:
          CI_POSTGRES_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CI_POSTGRES_EXPECTED_HEAD"
          node apps/worker/scripts/ci-postgres-suite.mjs --partition CORE_A --receipt "$RUNNER_TEMP/postgres-17-core-a.json"

      - name: Stop PostgreSQL 17
        if: always()
        run: node apps/worker/scripts/ci-postgres-container.mjs --stop

      - name: Upload the CORE_A partition receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-17-core-a-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/postgres-17-core-a.json
          if-no-files-found: error
          retention-days: 7

  postgres-17-core-b:
    name: PostgreSQL 17 CORE_B
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The fast-path cloud-target specs also dial the server over loopback TCP:
    # the container's published 127.0.0.1 port (ciPostgresTcpProfile), which
    # differs from the socket's PG_TEST_PORT. The suite passes this pair to its
    # SOCKET pass only; without it those tests would report as skipped.
    env:
      PG_TEST_TCP_HOST: "127.0.0.1"
      PG_TEST_TCP_PORT: "55432"
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # CORE_B binds the image runtime to its receipt. It goes first so that the
      # repository toolchain installed afterward stays first on PATH.
      - name: Install the Cloud Run image runtime Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          check-latest: false
          package-manager-cache: false

      # CORE_B still binds the image runtime and runs the transfer Q-1 dump case.
      - name: Name the image runtime and the committed Q-1 dump
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.16.0"
          dump="$GITHUB_WORKSPACE/apps/worker/analytics-v2-test/golden/dump/usage-monitor-db.json"
          test -f "$dump"
          {
            printf 'EDGE_E2E_NODE=%s\n' "$(command -v node)"
            printf 'POSTGRES_V12_TRANSFER_Q1_DUMP=%s\n' "$dump"
          } >> "$GITHUB_ENV"

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.2.0
          check-latest: false
          package-manager-cache: false

      # Two specs import Cloud Run host modules, so this job needs its lockfile too.
      - name: Install locked root, Worker and Cloud Run dependencies
        run: |
          set -euo pipefail
          npm install --global corepack@0.34.0 --force --ignore-scripts
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          test "$(node --version)" = "v26.2.0"
          test "$(pnpm --version)" = "11.9.0"
          pnpm install --frozen-lockfile --ignore-scripts
          npm --prefix apps/worker ci
          npm --prefix apps/worker/cloud-run ci

      - name: Create the private PostgreSQL socket root
        run: |
          set -euo pipefail
          sudo mkdir -p /private/tmp
          sudo chmod 1777 /private/tmp

      - name: Start PostgreSQL 17 and export the SOCKET profile
        run: node apps/worker/scripts/ci-postgres-container.mjs --export-socket-profile

      # analytics-v2-refresh's K-PAR spec runs the built analytics-refresh
      # worker bundle, so build the Cloud Run bundles before the suite.
      - name: Build the Cloud Run bundles the suite runs
        run: node apps/worker/cloud-run/build.mjs

      - name: Run the CORE_B partition in its routed profiles with zero skips
        env:
          CI_POSTGRES_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CI_POSTGRES_EXPECTED_HEAD"
          node apps/worker/scripts/ci-postgres-suite.mjs --partition CORE_B --receipt "$RUNNER_TEMP/postgres-17-core-b.json"

      - name: Stop PostgreSQL 17
        if: always()
        run: node apps/worker/scripts/ci-postgres-container.mjs --stop

      - name: Upload the CORE_B partition receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-17-core-b-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/postgres-17-core-b.json
          if-no-files-found: error
          retention-days: 7

  postgres-17-edge-e2e:
    name: PostgreSQL 17 EDGE_E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The fast-path cloud-target specs also dial the server over loopback TCP:
    # the container's published 127.0.0.1 port (ciPostgresTcpProfile), which
    # differs from the socket's PG_TEST_PORT. The suite passes this pair to its
    # SOCKET pass only; without it those tests would report as skipped.
    env:
      PG_TEST_TCP_HOST: "127.0.0.1"
      PG_TEST_TCP_PORT: "55432"
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The Cloud Run image runtime, for the edge end-to-end spec. It goes first
      # so that the repository toolchain installed after it stays first on PATH.
      - name: Install the Cloud Run image runtime Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          check-latest: false
          package-manager-cache: false

      # EDGE_E2E_NODE must be an absolute path to the Node.js 22.16.0 binary and
      # EDGE_E2E_GOLDEN an absolute path to the committed Q-1 golden; without
      # them the suite reports an EDGE_E2E environment gap and fails. This
      # hosted gate explicitly selects the current two-case D7 v3 qualification;
      # the canonical corpus path never selects v2 or historical mode by itself.
      # POSTGRES_V12_TRANSFER_Q1_DUMP names the same golden's dump for the
      # transfer spec's Q-1 case, which the suite reports as silently skipped
      # without it. Every value comes from the runner and the checkout, never
      # from the event.
      - name: Name the image runtime and the committed golden inputs
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.16.0"
          golden="$GITHUB_WORKSPACE/apps/worker/analytics-v2-test/golden"
          test -f "$golden/community-daily-response.json"
          test -f "$golden/dump/usage-monitor-db.json"
          {
            printf 'EDGE_E2E_NODE=%s\n' "$(command -v node)"
            printf 'EDGE_E2E_GOLDEN=%s\n' "$golden"
            printf 'EDGE_E2E_S9_COMPARISON_MODE=%s\n' 'current-worker-d1-d7'
            printf 'POSTGRES_V12_TRANSFER_Q1_DUMP=%s\n' "$golden/dump/usage-monitor-db.json"
          } >> "$GITHUB_ENV"

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.2.0
          check-latest: false
          package-manager-cache: false

      # The edge spec's S9 seeding rehearsal runs under this runtime, not the
      # image runtime: its importers need a newer node:sqlite than 22.16.0 has.
      - name: Name the repository runtime for the edge end-to-end seeding rehearsal
        run: |
          set -euo pipefail
          test "$(node --version)" = "v26.2.0"
          printf 'EDGE_E2E_REHEARSAL_NODE=%s\n' "$(command -v node)" >> "$GITHUB_ENV"

      # Two specs import Cloud Run host modules, so this job needs its lockfile too.
      - name: Install locked root, Worker and Cloud Run dependencies
        run: |
          set -euo pipefail
          npm install --global corepack@0.34.0 --force --ignore-scripts
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          test "$(node --version)" = "v26.2.0"
          test "$(pnpm --version)" = "11.9.0"
          pnpm install --frozen-lockfile --ignore-scripts
          npm --prefix apps/worker ci
          npm --prefix apps/worker/cloud-run ci

      - name: Create the private PostgreSQL socket root
        run: |
          set -euo pipefail
          sudo mkdir -p /private/tmp
          sudo chmod 1777 /private/tmp

      - name: Start PostgreSQL 17 and export the SOCKET profile
        run: node apps/worker/scripts/ci-postgres-container.mjs --export-socket-profile

      # analytics-v2-refresh's K-PAR spec runs the built analytics-refresh
      # worker bundle, so build the Cloud Run bundles before the suite.
      - name: Build the Cloud Run bundles the suite runs
        run: node apps/worker/cloud-run/build.mjs

      - name: Run the EDGE_E2E partition in its routed profiles with zero skips
        env:
          CI_POSTGRES_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CI_POSTGRES_EXPECTED_HEAD"
          node apps/worker/scripts/ci-postgres-suite.mjs --partition EDGE_E2E --receipt "$RUNNER_TEMP/postgres-17-edge-e2e.json"

      - name: Stop PostgreSQL 17
        if: always()
        run: node apps/worker/scripts/ci-postgres-container.mjs --stop

      - name: Upload the EDGE_E2E partition receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-17-edge-e2e-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/postgres-17-edge-e2e.json
          if-no-files-found: error
          retention-days: 7

  # When retrying this gate, re-run all jobs; re-run failed jobs alone cannot
  # combine sibling receipts from an earlier attempt. Exact run and attempt
  # binding deliberately prevents an earlier receipt from qualifying this gate.
  postgres-17-suite:
    name: PostgreSQL 17 suite
    needs:
      - postgres-17-core-a
      - postgres-17-core-b
      - postgres-17-edge-e2e
      - activation-producer-postgres-17
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.2.0
          check-latest: false
          package-manager-cache: false

      - name: Install locked root, Worker and Cloud Run dependencies
        run: |
          set -euo pipefail
          npm install --global corepack@0.34.0 --force --ignore-scripts
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          test "$(node --version)" = "v26.2.0"
          test "$(pnpm --version)" = "11.9.0"
          pnpm install --frozen-lockfile --ignore-scripts
          npm --prefix apps/worker ci
          npm --prefix apps/worker/cloud-run ci

      # Exact artifacts from this workflow run only, downloaded separately.
      - name: Download the CORE_A partition receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: postgres-17-core-a-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/postgres-17-core-a

      - name: Download the CORE_B partition receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: postgres-17-core-b-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/postgres-17-core-b

      - name: Download the EDGE_E2E partition receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: postgres-17-edge-e2e-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/postgres-17-edge-e2e

      - name: Require all partitions and exact coverage at this revision
        env:
          CI_POSTGRES_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_POSTGRES_CORE_A_RESULT: ${{ needs.postgres-17-core-a.result }}
          CI_POSTGRES_CORE_B_RESULT: ${{ needs.postgres-17-core-b.result }}
          CI_POSTGRES_EDGE_E2E_RESULT: ${{ needs.postgres-17-edge-e2e.result }}
          CI_POSTGRES_ACTIVATION_RESULT: ${{ needs.activation-producer-postgres-17.result }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CI_POSTGRES_EXPECTED_HEAD"
          test "$CI_POSTGRES_CORE_A_RESULT" = "success"
          test "$CI_POSTGRES_CORE_B_RESULT" = "success"
          test "$CI_POSTGRES_EDGE_E2E_RESULT" = "success"
          test "$CI_POSTGRES_ACTIVATION_RESULT" = "success"
          node apps/worker/scripts/ci-postgres-suite.mjs --aggregate "$RUNNER_TEMP/postgres-17-core-a/postgres-17-core-a.json" "$RUNNER_TEMP/postgres-17-core-b/postgres-17-core-b.json" "$RUNNER_TEMP/postgres-17-edge-e2e/postgres-17-edge-e2e.json"

  activation-producer-postgres-17:
    name: PostgreSQL 17 activation producer qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.2.0
          check-latest: false
          package-manager-cache: false

      - name: Install locked root, Worker and Cloud Run dependencies
        run: |
          set -euo pipefail
          npm install --global corepack@0.34.0 --force --ignore-scripts
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          test "$(node --version)" = "v26.2.0"
          test "$(pnpm --version)" = "11.9.0"
          pnpm install --frozen-lockfile --ignore-scripts
          npm --prefix apps/worker ci
          npm --prefix apps/worker/cloud-run ci

      - name: Create the private PostgreSQL socket root
        run: |
          set -euo pipefail
          sudo mkdir -p /private/tmp
          sudo chmod 1777 /private/tmp

      - name: Start PostgreSQL 17 and export the SOCKET profile
        run: node apps/worker/scripts/ci-postgres-container.mjs --export-socket-profile

      - name: Verify the selected revision and run focused activation producer regressions
        env:
          CI_POSTGRES_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CI_POSTGRES_EXPECTED_HEAD"
          node apps/worker/scripts/ci-postgres-activation-producer-suite.mjs

      - name: Stop PostgreSQL 17
        if: always()
        run: node apps/worker/scripts/ci-postgres-container.mjs --stop
