name: Signed Mac synthetic credential continuity
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Plan only or qualify exact signed bytes using synthetic credentials
        type: choice
        options: [plan, execute]
        default: plan
        required: true
      intake:
        description: Closed source, artifact, fixture and operation identity JSON plus sourceCandidate receipt
        type: string
        required: true
      confirmation:
        description: Execute requires RUN_DISPOSABLE_SIGNED_MAC_CREDENTIALS
        type: string
permissions:
  contents: read
concurrency:
  group: signed-mac-synthetic-credentials-arm64
  cancel-in-progress: false
jobs:
  credentials:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      MAC_CREDENTIAL_INTAKE: ${{ inputs.intake }}
      SELECTED_MODE: ${{ inputs.mode }}
      SELECTED_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Check out exact reviewed qualification source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned ARM Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.2.0
          architecture: arm64
          package-manager-cache: false
      - name: Admit source, fixture identity and mode before dependencies
        id: qualification
        shell: bash
        run: |
          node --input-type=module - <<'JS'
          import { appendFileSync } from 'node:fs';
          import { preflightMacCredentialEnvironment } from './scripts/lib/macos-credential-qualification-intake.mjs';
          const identity = preflightMacCredentialEnvironment();
          appendFileSync(process.env.GITHUB_OUTPUT, 'identity=' + JSON.stringify(identity) + '\n');
          JS
      - name: Install locked verification dependencies
        shell: bash
        run: |
          npm install --global corepack@0.34.0 --force --ignore-scripts
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Inspect or qualify the sealed app with synthetic credentials
        env:
          MAC_CREDENTIAL_INTAKE: ${{ steps.qualification.outputs.identity }}
        shell: bash
        run: |
          umask 077
          mkdir -m 700 credential-receipts
          args=(--plan)
          if [[ "$SELECTED_MODE" == execute ]]; then
            args=(--execute --confirm "$SELECTED_CONFIRMATION")
          fi
          node scripts/smoke-electron-macos-credentials.mjs "${args[@]}" > credential-receipts/execution.json
      - name: Retain content-free qualification result only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-mac-credentials-arm64-${{ github.run_id }}
          path: credential-receipts/*.json
          if-no-files-found: error
          retention-days: 14
