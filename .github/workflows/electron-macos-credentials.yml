name: Signed Mac synthetic credential continuity
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Credential qualification or separate synthetic-only PF host canary
        type: choice
        options: [plan, execute, pf-canary-plan, pf-canary-execute, pf-canary-inspect]
        default: plan
        required: true
      intake:
        description: Closed credential intake JSON; use {} for PF canary modes
        type: string
        required: true
      confirmation:
        description: Credential execute requires RUN_DISPOSABLE_SIGNED_MAC_CREDENTIALS; PF execute requires RUN_DISPOSABLE_MAC_PF_CANARY
        type: string
      canary_scenario:
        description: PF canary only; ignored by credential plan and execute
        type: choice
        options: [network, probe-timeout]
        default: network
        required: false
permissions:
  contents: read
concurrency:
  group: signed-mac-synthetic-credentials-arm64
  cancel-in-progress: false
jobs:
  credentials:
    if: inputs.mode == 'plan' || inputs.mode == 'execute'
    runs-on: macos-26
    timeout-minutes: 25
    env:
      MAC_CREDENTIAL_INTAKE: ${{ inputs.intake }}
      SELECTED_MODE: ${{ inputs.mode }}
      SELECTED_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Check out exact reviewed qualification source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned ARM Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.2.0
          architecture: arm64
          package-manager-cache: false
      - name: Admit source, fixture identity and mode before dependencies
        id: qualification
        shell: bash
        run: |
          node --input-type=module - <<'JS'
          import { appendFileSync } from 'node:fs';
          import { preflightMacCredentialEnvironment } from './scripts/lib/macos-credential-qualification-intake.mjs';
          const identity = preflightMacCredentialEnvironment();
          appendFileSync(process.env.GITHUB_OUTPUT, 'identity=' + JSON.stringify(identity) + '\n');
          JS
      - name: Install locked verification dependencies
        shell: bash
        run: |
          npm install --global corepack@0.34.0 --force --ignore-scripts
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Inspect or qualify the sealed app with synthetic credentials
        env:
          MAC_CREDENTIAL_INTAKE: ${{ steps.qualification.outputs.identity }}
        shell: bash
        run: |
          umask 077
          mkdir -m 700 credential-receipts
          args=(--plan)
          if [[ "$SELECTED_MODE" == execute ]]; then
            args=(--execute --confirm "$SELECTED_CONFIRMATION")
          fi
          node scripts/smoke-electron-macos-credentials.mjs "${args[@]}" > credential-receipts/execution.json
      - name: Retain content-free qualification result only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-mac-credentials-arm64-${{ github.run_id }}
          path: credential-receipts/*.json
          if-no-files-found: error
          retention-days: 14
  canary:
    if: inputs.mode == 'pf-canary-plan' || inputs.mode == 'pf-canary-execute'
    runs-on: macos-26
    timeout-minutes: 5
    env:
      SELECTED_MODE: ${{ inputs.mode }}
      PF_CANARY_SCENARIO: ${{ inputs.canary_scenario }}
      PF_CANARY_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Check out exact reviewed canary source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pinned ARM Node before containment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.2.0
          architecture: arm64
          package-manager-cache: false
      - name: Prepare bounded local operation
        shell: bash
        run: |
          umask 077
          mkdir -m 700 pf-canary-receipts
          node --input-type=module - <<'JS'
          import { randomUUID } from 'node:crypto';
          import { appendFileSync } from 'node:fs';
          appendFileSync(process.env.GITHUB_ENV, 'PF_CANARY_OPERATION=' + randomUUID() + '\n');
          JS
      - name: Plan or start independent root supervisor then exit coordinator
        shell: bash
        run: |
          args=(--plan)
          if [[ "$SELECTED_MODE" == pf-canary-execute ]]; then args=(--start); fi
          node scripts/qualify-macos-pf-canary.mjs "${args[@]}" "$PF_CANARY_OPERATION" "$PF_CANARY_SCENARIO" > pf-canary-receipts/start.json
      - name: Collect only after independent local cleanup
        if: always() && inputs.mode == 'pf-canary-execute'
        shell: bash
        run: |
          node scripts/qualify-macos-pf-canary.mjs --collect "$PF_CANARY_OPERATION" "$PF_CANARY_SCENARIO" > pf-canary-receipts/result.json
      - name: Retain content-free canary receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-pf-canary-${{ github.run_id }}
          path: pf-canary-receipts/*.json
          if-no-files-found: error
          retention-days: 14
  inspection:
    if: inputs.mode == 'pf-canary-inspect'
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - name: Check out exact reviewed read-only inspection source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pinned ARM Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.2.0
          architecture: arm64
          package-manager-cache: false
      - name: Inspect all PF prerequisites without changing PF or launching probes
        shell: bash
        run: |
          umask 077
          mkdir -m 700 pf-inspection-receipts
          operation="$(node --input-type=module -e 'import { randomUUID } from "node:crypto"; console.log(randomUUID())')"
          node scripts/qualify-macos-pf-canary.mjs --inspect "$operation" network > pf-inspection-receipts/inspection.json
      - name: Retain only closed content-free inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-pf-inspection-${{ github.run_id }}
          path: pf-inspection-receipts/inspection.json
          if-no-files-found: error
          retention-days: 14
