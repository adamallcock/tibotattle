name: Electron Windows production signing
run-name: Windows signing (${{ inputs.source-revision }})
on:
  # GitHub registers the manual workflow without preparing or signing artifacts.
  push:
    branches: [codex/unified-desktop-accountless]
  workflow_dispatch:
    inputs:
      source-revision:
        description: Exact immutable source revision to sign
        required: true
        type: string
      build-number:
        description: Approved positive Windows build number
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: electron-windows-production-signing
  cancel-in-progress: false
jobs:
  registration:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: printf '%s\n' 'WINDOWS_SIGNING_WORKFLOW_REGISTERED'
  prepare-native:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      manifest-sha256: ${{ steps.subjects.outputs.manifest_sha256 }}
      candidate-sha256: ${{ steps.candidate.outputs.candidate_sha256 }}
    env:
      SOURCE_REVISION: ${{ inputs.source-revision }}
      BUILD_NUMBER: ${{ inputs.build-number }}
      DISPATCH_SHA: ${{ github.sha }}
      CI: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Bind source and admit tools before dependency preparation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:ACTIONS_ID_TOKEN_REQUEST_TOKEN -or $env:ACTIONS_ID_TOKEN_REQUEST_URL) { throw 'WINDOWS_PREPARATION_MUST_NOT_HAVE_OIDC' }
          if ($env:SOURCE_REVISION -notmatch '^[0-9a-f]{40}$' -or $env:SOURCE_REVISION -cne $env:DISPATCH_SHA -or (git rev-parse HEAD).Trim() -cne $env:DISPATCH_SHA) { throw 'WINDOWS_SIGNING_SOURCE_REVISION_MISMATCH' }
          if ($env:BUILD_NUMBER -notmatch '^[1-9][0-9]{0,9}$') { throw 'WINDOWS_SIGNING_BUILD_NUMBER_INVALID' }
          node scripts/sign-electron-windows-subjects.mjs prepare-tools --toolchain-root .release-build/windows-signing-tools
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_SIGNING_TOOLCHAIN_NOT_ADMITTED' }
      - uses: ./.github/actions/windows-unprivileged-build
      - name: Build and stage the exact unsigned native candidate
        id: candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $npmCommand = (Get-Command npm.cmd).Source
          $nodeGypScript = Join-Path (Split-Path $npmCommand -Parent) 'node_modules/npm/node_modules/node-gyp/bin/node-gyp.js'
          if (-not (Test-Path -LiteralPath $nodeGypScript -PathType Leaf)) { throw 'WINDOWS_BINDING_BUILDER_UNAVAILABLE' }
          node $nodeGypScript rebuild --directory native/windows-filesystem
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_BINDING_BUILD_FAILED' }
          node scripts/build-windows-filesystem-manifest.mjs
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_BINDING_MANIFEST_FAILED' }
          $binding = Join-Path $env:GITHUB_WORKSPACE 'native/windows-filesystem/build/Release/windows_filesystem.node'
          node scripts/package-electron-production.mjs --replace-staging --target win32-x64 --source-revision $env:SOURCE_REVISION --build-number $env:BUILD_NUMBER --windows-binding $binding --windows-manifest "$binding.manifest.json"
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_PRODUCTION_STAGE_FAILED' }
          $candidate = Join-Path $env:GITHUB_WORKSPACE '.release-build/electron-production/win32-x64/production-source-candidate.json'
          $digest = (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
          "candidate_sha256=$digest" >> $env:GITHUB_OUTPUT
      - name: Bind the native signing subjects
        id: subjects
        shell: pwsh
        env:
          CANDIDATE_SHA256: ${{ steps.candidate.outputs.candidate_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $candidateRoot = Join-Path $env:GITHUB_WORKSPACE '.release-build/electron-production/win32-x64'
          $candidate = Join-Path $candidateRoot 'production-source-candidate.json'
          node scripts/prepare-electron-windows-signing-stage.mjs --stage native --candidate-receipt $candidate --candidate-sha256 $env:CANDIDATE_SHA256 --source-revision $env:SOURCE_REVISION
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_NATIVE_SUBJECT_MANIFEST_FAILED' }
          node scripts/rebind-electron-windows-native-modules.mjs --probe-authenticode-pre-sign --candidate-receipt $candidate
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_NATIVE_PRE_SIGN_PROBE_FAILED' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-signing-tools-${{ github.run_id }}
          path: .release-build/windows-signing-tools
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-stage-native-${{ github.run_id }}
          path: .release-build/electron-production/win32-x64
          if-no-files-found: error
          retention-days: 14
  sign-native:
    needs: [prepare-native]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/electron-windows-sign-subjects.yml
    with:
      source-revision: ${{ inputs.source-revision }}
      candidate-sha256: ${{ needs.prepare-native.outputs.candidate-sha256 }}
      manifest-sha256: ${{ needs.prepare-native.outputs.manifest-sha256 }}
      stage: native
      input-artifact: windows-stage-native-${{ github.run_id }}
  prepare-application:
    needs: [prepare-native, sign-native]
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      manifest-sha256: ${{ steps.stage.outputs.manifest_sha256 }}
    env:
      SOURCE_REVISION: ${{ inputs.source-revision }}
      CANDIDATE_SHA256: ${{ needs.prepare-native.outputs.candidate-sha256 }}
      SIGNED_RECEIPT_SHA256: ${{ needs.sign-native.outputs.receipt-sha256 }}
      PREVIOUS_MANIFEST_SHA256: ${{ needs.prepare-native.outputs.manifest-sha256 }}
      CI: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: ./.github/actions/windows-unprivileged-build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-stage-native-${{ github.run_id }}
          path: .release-build/electron-production/win32-x64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-signed-native-${{ github.run_id }}
          path: .release-build/windows-signed-subjects
      - name: Continue unprivileged packaging after exact signed-byte transfer
        id: stage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = Join-Path $env:GITHUB_WORKSPACE '.release-build/electron-production/win32-x64/production-source-candidate.json'
          node scripts/prepare-electron-windows-signing-stage.mjs --stage application --candidate-receipt $candidate --candidate-sha256 $env:CANDIDATE_SHA256 --source-revision $env:SOURCE_REVISION --signed-root .release-build/windows-signed-subjects --signed-receipt-sha256 $env:SIGNED_RECEIPT_SHA256 --manifest-sha256 $env:PREVIOUS_MANIFEST_SHA256
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_SIGNING_STAGE_FAILED' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-stage-application-${{ github.run_id }}
          path: .release-build/electron-production/win32-x64
          if-no-files-found: error
          retention-days: 14
  sign-application:
    needs: [prepare-native, prepare-application]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/electron-windows-sign-subjects.yml
    with:
      source-revision: ${{ inputs.source-revision }}
      candidate-sha256: ${{ needs.prepare-native.outputs.candidate-sha256 }}
      manifest-sha256: ${{ needs.prepare-application.outputs.manifest-sha256 }}
      stage: application
      input-artifact: windows-stage-application-${{ github.run_id }}
  prepare-uninstaller:
    needs: [prepare-native, prepare-application, sign-application]
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      manifest-sha256: ${{ steps.stage.outputs.manifest_sha256 }}
      continuation-sha256: ${{ steps.stage.outputs.continuation_sha256 }}
    env:
      SOURCE_REVISION: ${{ inputs.source-revision }}
      CANDIDATE_SHA256: ${{ needs.prepare-native.outputs.candidate-sha256 }}
      SIGNED_RECEIPT_SHA256: ${{ needs.sign-application.outputs.receipt-sha256 }}
      PREVIOUS_MANIFEST_SHA256: ${{ needs.prepare-application.outputs.manifest-sha256 }}
      CI: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: ./.github/actions/windows-unprivileged-build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-stage-application-${{ github.run_id }}
          path: .release-build/electron-production/win32-x64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-signed-application-${{ github.run_id }}
          path: .release-build/windows-signed-subjects
      - name: Continue unprivileged packaging after exact signed-byte transfer
        id: stage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = Join-Path $env:GITHUB_WORKSPACE '.release-build/electron-production/win32-x64/production-source-candidate.json'
          node scripts/prepare-electron-windows-signing-stage.mjs --stage uninstaller --candidate-receipt $candidate --candidate-sha256 $env:CANDIDATE_SHA256 --source-revision $env:SOURCE_REVISION --signed-root .release-build/windows-signed-subjects --signed-receipt-sha256 $env:SIGNED_RECEIPT_SHA256 --manifest-sha256 $env:PREVIOUS_MANIFEST_SHA256
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_SIGNING_STAGE_FAILED' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-stage-uninstaller-${{ github.run_id }}
          path: .release-build/electron-production/win32-x64
          if-no-files-found: error
          retention-days: 14
  sign-uninstaller:
    needs: [prepare-native, prepare-uninstaller]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/electron-windows-sign-subjects.yml
    with:
      source-revision: ${{ inputs.source-revision }}
      candidate-sha256: ${{ needs.prepare-native.outputs.candidate-sha256 }}
      manifest-sha256: ${{ needs.prepare-uninstaller.outputs.manifest-sha256 }}
      stage: uninstaller
      input-artifact: windows-stage-uninstaller-${{ github.run_id }}
  prepare-installer:
    needs: [prepare-native, prepare-uninstaller, sign-uninstaller]
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      manifest-sha256: ${{ steps.stage.outputs.manifest_sha256 }}
    env:
      SOURCE_REVISION: ${{ inputs.source-revision }}
      CANDIDATE_SHA256: ${{ needs.prepare-native.outputs.candidate-sha256 }}
      SIGNED_RECEIPT_SHA256: ${{ needs.sign-uninstaller.outputs.receipt-sha256 }}
      PREVIOUS_MANIFEST_SHA256: ${{ needs.prepare-uninstaller.outputs.manifest-sha256 }}
      CONTINUATION_SHA256: ${{ needs.prepare-uninstaller.outputs.continuation-sha256 }}
      CI: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: ./.github/actions/windows-unprivileged-build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-stage-uninstaller-${{ github.run_id }}
          path: .release-build/electron-production/win32-x64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-signed-uninstaller-${{ github.run_id }}
          path: .release-build/windows-signed-subjects
      - name: Continue unprivileged packaging after exact signed-byte transfer
        id: stage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = Join-Path $env:GITHUB_WORKSPACE '.release-build/electron-production/win32-x64/production-source-candidate.json'
          node scripts/prepare-electron-windows-signing-stage.mjs --stage installer --candidate-receipt $candidate --candidate-sha256 $env:CANDIDATE_SHA256 --source-revision $env:SOURCE_REVISION --signed-root .release-build/windows-signed-subjects --signed-receipt-sha256 $env:SIGNED_RECEIPT_SHA256 --manifest-sha256 $env:PREVIOUS_MANIFEST_SHA256 --continuation-sha256 $env:CONTINUATION_SHA256
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_SIGNING_STAGE_FAILED' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-stage-installer-${{ github.run_id }}
          path: .release-build/electron-production/win32-x64
          if-no-files-found: error
          retention-days: 14
  sign-installer:
    needs: [prepare-native, prepare-installer]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/electron-windows-sign-subjects.yml
    with:
      source-revision: ${{ inputs.source-revision }}
      candidate-sha256: ${{ needs.prepare-native.outputs.candidate-sha256 }}
      manifest-sha256: ${{ needs.prepare-installer.outputs.manifest-sha256 }}
      stage: installer
      input-artifact: windows-stage-installer-${{ github.run_id }}
  qualify:
    needs: [prepare-native, prepare-installer, sign-installer]
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      SOURCE_REVISION: ${{ inputs.source-revision }}
      CANDIDATE_SHA256: ${{ needs.prepare-native.outputs.candidate-sha256 }}
      SIGNED_RECEIPT_SHA256: ${{ needs.sign-installer.outputs.receipt-sha256 }}
      PREVIOUS_MANIFEST_SHA256: ${{ needs.prepare-installer.outputs.manifest-sha256 }}
      CI: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: ./.github/actions/windows-unprivileged-build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-stage-installer-${{ github.run_id }}
          path: .release-build/electron-production/win32-x64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-signed-installer-${{ github.run_id }}
          path: .release-build/windows-signed-subjects
      - name: Finalize signed bytes and qualify without signing authority
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidateRoot = Join-Path $env:GITHUB_WORKSPACE '.release-build/electron-production/win32-x64'
          $candidate = Join-Path $candidateRoot 'production-source-candidate.json'
          node scripts/prepare-electron-windows-signing-stage.mjs --stage complete --candidate-receipt $candidate --candidate-sha256 $env:CANDIDATE_SHA256 --source-revision $env:SOURCE_REVISION --signed-root .release-build/windows-signed-subjects --signed-receipt-sha256 $env:SIGNED_RECEIPT_SHA256 --manifest-sha256 $env:PREVIOUS_MANIFEST_SHA256
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_SIGNED_FINALIZATION_FAILED' }
          $package = Get-Content -LiteralPath (Join-Path $candidateRoot 'app/package.json') -Raw | ConvertFrom-Json
          $installer = Join-Path $candidateRoot ("artifacts/TiboTattle-{0}-Windows-x64.exe" -f $package.version)
          $digest = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          node scripts/smoke-electron-windows-signed-installed.mjs --execute --installer $installer --installer-sha256 $digest --staged-app (Join-Path $candidateRoot 'app') --source-candidate $candidate --source-revision $env:SOURCE_REVISION --receipt (Join-Path $candidateRoot 'evidence/windows-signed-installed.json')
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_SIGNED_INSTALLED_QUALIFICATION_FAILED' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: electron-windows-signed-${{ github.run_id }}
          path: |
            .release-build/electron-production/win32-x64/artifacts/TiboTattle-*-Windows-x64.exe
            .release-build/electron-production/win32-x64/artifacts/TiboTattle-*-Windows-x64.exe.blockmap
            .release-build/electron-production/win32-x64/artifacts/latest.yml
            .release-build/electron-production/win32-x64/production-source-candidate.json
            .release-build/electron-production/win32-x64/app-update.yml
            .release-build/electron-production/win32-x64/evidence/windows-signing-operation-ledger.json
            .release-build/electron-production/win32-x64/windows-native-rebinding/rebound.json
            .release-build/electron-production/win32-x64/evidence/windows-signed-installed.json
            .release-build/electron-production/win32-x64/signing-transfer/native-signed-receipt.json
            .release-build/electron-production/win32-x64/signing-transfer/application-signed-receipt.json
            .release-build/electron-production/win32-x64/signing-transfer/uninstaller-signed-receipt.json
            .release-build/electron-production/win32-x64/signing-transfer/installer-signed-receipt.json
          if-no-files-found: error
          retention-days: 14
