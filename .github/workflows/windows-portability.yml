name: Windows portability canary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-portability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    name: Native Windows x64 security qualification (${{ matrix.cache-mode }})
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cache-mode:
          - warm
          - clean
    env:
      CI: "1"
      USAGE_MONITOR_TEST_LANE_REPORTER: dot
      TIBOTATTLE_QUALIFICATION_CACHE_MODE: ${{ matrix.cache-mode }}
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the selected revision is immutable
        shell: pwsh
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = $env:EXPECTED_REVISION.Trim().ToLowerInvariant()
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($expected -notmatch '^[0-9a-f]{40}$' -or $actual -ne $expected) {
            Write-Error 'WINDOWS_QUALIFICATION_REVISION_MISMATCH'
            exit 1
          }
          "TIBOTATTLE_QUALIFICATION_REVISION=$actual" >> $env:GITHUB_ENV

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.2.0
          check-latest: false
          package-manager-cache: false

      - name: Activate pinned pnpm
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --global corepack@0.34.0 --force
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'WINDOWS_QUALIFICATION_COREPACK_INSTALL_FAILED'
            exit 1
          }
          corepack enable
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'WINDOWS_QUALIFICATION_COREPACK_ENABLE_FAILED'
            exit 1
          }
          corepack prepare pnpm@11.9.0 --activate
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'WINDOWS_QUALIFICATION_PNPM_ACTIVATION_FAILED'
            exit 1
          }
          $corepackVersion = (corepack --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $corepackVersion -ne '0.34.0') {
            Write-Error 'WINDOWS_QUALIFICATION_COREPACK_VERSION_MISMATCH'
            exit 1
          }
          $nodeVersion = (node --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $nodeVersion -ne 'v26.2.0') {
            Write-Error 'WINDOWS_QUALIFICATION_NODE_VERSION_MISMATCH'
            exit 1
          }
          $pnpmVersion = (pnpm --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $pnpmVersion -ne '11.9.0') {
            Write-Error 'WINDOWS_QUALIFICATION_PNPM_VERSION_MISMATCH'
            exit 1
          }

      - name: Resolve pnpm store
        if: ${{ matrix.cache-mode == 'warm' }}
        id: pnpm-store
        shell: pwsh
        run: '"path=$(pnpm store path --silent)" >> $env:GITHUB_OUTPUT'

      - name: Restore pnpm store cache
        if: ${{ matrix.cache-mode == 'warm' }}
        id: pnpm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: windows-2025-x64-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install locked dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ matrix.cache-mode }}' -eq 'clean') {
            $cleanStore = Join-Path $env:RUNNER_TEMP 'tibotattle-pnpm-clean-store'
            if (Test-Path -LiteralPath $cleanStore) {
              Remove-Item -LiteralPath $cleanStore -Recurse -Force
            }
            pnpm install --frozen-lockfile --store-dir $cleanStore
          } else {
            pnpm install --frozen-lockfile
            if (Test-Path -LiteralPath 'node_modules') {
              Remove-Item -LiteralPath 'node_modules' -Recurse -Force
            }
            pnpm install --frozen-lockfile --offline
          }
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'WINDOWS_QUALIFICATION_DEPENDENCY_INSTALL_FAILED'
            exit 1
          }

      - name: Build reviewed native filesystem adapter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $productionBuildLog = Join-Path $env:RUNNER_TEMP 'windows-filesystem-production-build.log'
          $qualificationBuildLog = Join-Path $env:RUNNER_TEMP 'windows-filesystem-qualification-build.log'
          $npmCommand = (Get-Command npm.cmd).Source
          $nodeRoot = Split-Path $npmCommand -Parent
          $nodeGypScript = Join-Path $nodeRoot 'node_modules\npm\node_modules\node-gyp\bin\node-gyp.js'
          if (-not (Test-Path -LiteralPath $nodeGypScript -PathType Leaf)) {
            Write-Error 'WINDOWS_FILESYSTEM_BINDING_BUILDER_UNAVAILABLE'
            exit 1
          }
          # The ordinary build has an explicit default of zero in binding.gyp;
          # it must emit only the production target. The qualification target
          # is compiled in a second, explicit pass with test hooks enabled.
          node $nodeGypScript rebuild --directory native/windows-filesystem *> $productionBuildLog
          if ($LASTEXITCODE -ne 0) {
            # This hosted build runs before credentials or user state are
            # created. A bounded compiler tail is therefore safe and necessary
            # to diagnose native source failures without dumping later test
            # output, paths, SIDs, or credential-shaped values.
            Get-Content -LiteralPath $productionBuildLog -Tail 200
            Write-Error 'WINDOWS_FILESYSTEM_PRODUCTION_BUILD_FAILED'
            exit 1
          }
          $qualificationBindingPath = Join-Path $env:GITHUB_WORKSPACE 'native/windows-filesystem/build/Release/windows_filesystem_qualification.node'
          if (Test-Path -LiteralPath $qualificationBindingPath -PathType Leaf) {
            Write-Error 'WINDOWS_FILESYSTEM_PRODUCTION_BUILD_EMITTED_QUALIFICATION'
            exit 1
          }
          node $nodeGypScript rebuild --directory native/windows-filesystem -- -Dtibotattle_build_qualification=1 *> $qualificationBuildLog
          if ($LASTEXITCODE -ne 0) {
            Get-Content -LiteralPath $qualificationBuildLog -Tail 200
            Write-Error 'WINDOWS_FILESYSTEM_QUALIFICATION_BUILD_FAILED'
            exit 1
          }
          if (-not (Test-Path -LiteralPath $qualificationBindingPath -PathType Leaf)) {
            Write-Error 'WINDOWS_FILESYSTEM_QUALIFICATION_BUILD_OUTPUT_MISSING'
            exit 1
          }
          $qualificationDestination = Join-Path $env:RUNNER_TEMP 'windows_filesystem_qualification.node'
          if (Test-Path -LiteralPath $qualificationDestination -PathType Leaf) {
            Write-Error 'WINDOWS_FILESYSTEM_QUALIFICATION_DESTINATION_EXISTS'
            exit 1
          }
          Move-Item -LiteralPath $qualificationBindingPath -Destination $qualificationDestination
          if (Test-Path -LiteralPath $qualificationBindingPath -PathType Leaf) {
            Write-Error 'WINDOWS_FILESYSTEM_PRODUCTION_BUILD_EMITTED_QUALIFICATION'
            exit 1
          }
          if (-not (Test-Path -LiteralPath $qualificationDestination -PathType Leaf)) {
            Write-Error 'WINDOWS_FILESYSTEM_QUALIFICATION_BINDING_MOVE_FAILED'
            exit 1
          }
          "TIBOTATTLE_WINDOWS_QUALIFICATION_BINDING_PATH=$qualificationDestination" >> $env:GITHUB_ENV

      - name: Build the binding integrity manifest
        shell: pwsh
        run: node ./scripts/build-windows-filesystem-manifest.mjs

      - name: Verify and record binding integrity metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'native/windows-filesystem/build/Release/windows_filesystem.node.manifest.json'
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            Write-Error 'WINDOWS_FILESYSTEM_BINDING_MANIFEST_MISSING'
            exit 1
          }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.schemaVersion -ne 'windows-filesystem-binding-manifest-v1' -or
              $manifest.platform -ne 'win32' -or
              $manifest.architecture -ne 'x64' -or
              $manifest.sha256 -notmatch '^[0-9a-f]{64}$' -or
              $manifest.bytes -le 0 -or
              $manifest.approvedPolicy.productionSafe -ne $false -or
              $manifest.approvedPolicy.pathWalkRaceSafe -ne $false -or
              $manifest.approvedPolicy.credentialMutexSafe -ne $true -or
              $manifest.approvedPolicy.credentialAuditFileGuardSafe -ne $true -or
              $manifest.credentialAuditFileGuardContractVersion -ne 'windows-credential-audit-file-guard-v1' -or
              $manifest.credentialMutexContractVersion -ne 'windows-credential-mutex-v1') {
            Write-Error 'WINDOWS_FILESYSTEM_BINDING_MANIFEST_INVALID'
            exit 1
          }
          "TIBOTATTLE_WINDOWS_BINDING_SHA256=$($manifest.sha256)" >> $env:GITHUB_ENV
          "TIBOTATTLE_WINDOWS_BINDING_BYTES=$($manifest.bytes)" >> $env:GITHUB_ENV

      - name: Record native environment
        shell: pwsh
        run: |
          "### Native Windows x64 environment" >> $env:GITHUB_STEP_SUMMARY
          "- Runner image: $env:ImageOS $env:ImageVersion" >> $env:GITHUB_STEP_SUMMARY
          "- Architecture: $env:PROCESSOR_ARCHITECTURE" >> $env:GITHUB_STEP_SUMMARY
          "- Node: $(node --version)" >> $env:GITHUB_STEP_SUMMARY
          "- pnpm: $(pnpm --version)" >> $env:GITHUB_STEP_SUMMARY
          "- Revision: $env:TIBOTATTLE_QUALIFICATION_REVISION" >> $env:GITHUB_STEP_SUMMARY
          "- Cache mode: ${{ matrix.cache-mode }}" >> $env:GITHUB_STEP_SUMMARY
          "- Cache restore hit: ${{ steps.pnpm-cache.outputs.cache-hit || 'not-applicable' }}" >> $env:GITHUB_STEP_SUMMARY
          "- Warm proof: restored or online-primed store followed by an offline reinstall" >> $env:GITHUB_STEP_SUMMARY
          "- Native binding bytes: $env:TIBOTATTLE_WINDOWS_BINDING_BYTES" >> $env:GITHUB_STEP_SUMMARY
          "- Native binding SHA-256: $env:TIBOTATTLE_WINDOWS_BINDING_SHA256" >> $env:GITHUB_STEP_SUMMARY
          "- Credential mutex contract: windows-credential-mutex-v1 (owner-only, per capability)" >> $env:GITHUB_STEP_SUMMARY
          "- Credential audit file guard: windows-credential-audit-file-guard-v1 (main, journal, and two owned ancestors)" >> $env:GITHUB_STEP_SUMMARY

      - name: Run bounded Windows filesystem security diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --input-type=module -e 'import { FIXED_STATUS, WINDOWS_PREPARED_DIRECTORY_ERROR_ALLOWLIST, WINDOWS_PREPARED_DIRECTORY_STAGE_ALLOWLIST, WINDOWS_SQLITE_PUBLISH_ERROR_ALLOWLIST, WINDOWS_SQLITE_PUBLISH_STAGE_ALLOWLIST, runNodeTests } from "./scripts/windows-security-qualification.mjs"; try { await runNodeTests(["test/windows-filesystem-security.test.js"], { timeoutMs: 120_000 }); console.log("WINDOWS_FILESYSTEM_SECURITY_DIAGNOSTIC_PASSED"); } catch (error) { const status = error?.code && Object.values(FIXED_STATUS).includes(error.code) ? error.code : FIXED_STATUS.failed; const testIndex = Number.isSafeInteger(error?.testIndex) && error.testIndex > 0 ? error.testIndex : "unavailable"; const testIndexes = Array.isArray(error?.testIndexes) && error.testIndexes.length <= 64 && error.testIndexes.every((value) => Number.isSafeInteger(value) && value > 0) ? error.testIndexes : []; const testLocations = Array.isArray(error?.testLocations) && error.testLocations.length <= 64 && error.testLocations.every((value) => Array.isArray(value) && value.length === 2 && value.every((part) => Number.isSafeInteger(part) && part > 0)) ? error.testLocations : []; const publishStages = Array.isArray(error?.publishStages) && error.publishStages.length <= 64 && error.publishStages.every((value) => WINDOWS_SQLITE_PUBLISH_STAGE_ALLOWLIST.includes(value)) ? [...new Set(error.publishStages)] : []; const publishErrors = Array.isArray(error?.publishErrors) && error.publishErrors.length <= 64 && error.publishErrors.every((value) => WINDOWS_SQLITE_PUBLISH_ERROR_ALLOWLIST.includes(value)) ? [...new Set(error.publishErrors)] : []; const preparedStages = Array.isArray(error?.preparedStages) && error.preparedStages.length <= 64 && error.preparedStages.every((value) => WINDOWS_PREPARED_DIRECTORY_STAGE_ALLOWLIST.includes(value)) ? [...new Set(error.preparedStages)] : []; const preparedErrors = Array.isArray(error?.preparedErrors) && error.preparedErrors.length <= 64 && error.preparedErrors.every((value) => WINDOWS_PREPARED_DIRECTORY_ERROR_ALLOWLIST.includes(value)) ? [...new Set(error.preparedErrors)] : []; console.error(`${status} test_index=${testIndex} test_indexes=${testIndexes.length > 0 ? testIndexes.join(",") : "unavailable"} test_locations=${testLocations.length > 0 ? testLocations.map(([line, column]) => `${line}:${column}`).join(";") : "unavailable"} publish_stages=${publishStages.length > 0 ? publishStages.join(",") : "unavailable"} publish_errors=${publishErrors.length > 0 ? publishErrors.join(",") : "unavailable"} prepared_stages=${preparedStages.length > 0 ? preparedStages.join(",") : "unavailable"} prepared_errors=${preparedErrors.length > 0 ? preparedErrors.join(",") : "unavailable"}`); process.exitCode = 1; }'

      - name: Run bounded per-file Windows portable diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node ./scripts/run-windows-portable-diagnostic.mjs
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'WINDOWS_PORTABLE_DIAGNOSTIC_FAILED'
            exit 1
          }

      - name: Run portable Windows qualification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $portableLog = Join-Path $env:RUNNER_TEMP 'windows-portable-qualification.log'
          pnpm test:portable *> $portableLog
          if ($LASTEXITCODE -ne 0) {
            # The portable lane is content-free by contract. Emit only a
            # bounded tail so a Windows-only test failure remains actionable.
            Get-Content -LiteralPath $portableLog -Tail 240
            Write-Error 'WINDOWS_PORTABLE_QUALIFICATION_FAILED'
            exit 1
          }

      - name: Prepare disposable qualification state root
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qualificationCodexHome = Join-Path $env:RUNNER_TEMP 'tibotattle-codex-home'
          $qualificationStateRoot = Join-Path $env:RUNNER_TEMP 'tibotattle-windows-private-state'
          New-Item -ItemType Directory -Force -Path $qualificationCodexHome | Out-Null
          "CODEX_HOME=$qualificationCodexHome" >> $env:GITHUB_ENV
          "TIBOTATTLE_WINDOWS_QUALIFICATION_STATE_ROOT=$qualificationStateRoot" >> $env:GITHUB_ENV

      - name: Run content-free Windows security qualification
        shell: pwsh
        env:
          USAGE_MONITOR_WINDOWS_QUALIFICATION: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $result = node ./scripts/windows-security-qualification.mjs
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'WINDOWS_SECURITY_QUALIFICATION_FAILED'
            exit 1
          }
          $qualificationResultPath = Join-Path $env:RUNNER_TEMP 'tibotattle-windows-security-qualification.txt'
          [IO.File]::WriteAllText(
            $qualificationResultPath,
            "$result`n",
            [Text.UTF8Encoding]::new($false)
          )
          "TIBOTATTLE_WINDOWS_SECURITY_QUALIFICATION_RESULT_PATH=$qualificationResultPath" >> $env:GITHUB_ENV
          "### Content-free security result" >> $env:GITHUB_STEP_SUMMARY
          "- Command: node ./scripts/windows-security-qualification.mjs" >> $env:GITHUB_STEP_SUMMARY
          "- Result: $result" >> $env:GITHUB_STEP_SUMMARY
          "- Production promotion: blocked" >> $env:GITHUB_STEP_SUMMARY
          "- Qualified here: per-capability Win32 named mutex and durable prepared/settled/recovered credential audit" >> $env:GITHUB_STEP_SUMMARY
          "- Canonical deferrals: docs/goals/2026-08-17-windows-security-credentials-goal.md" >> $env:GITHUB_STEP_SUMMARY
          "- Deferred: authenticated binary provenance; replacement CAS; complete DACL/path/concurrency matrix; selector and remaining state/SQLite integration; export locking; retention/uninstall policy; packaging, signing, installer, and updater" >> $env:GITHUB_STEP_SUMMARY

      - name: Reconfirm checked-out revision before Electron artifact work
        shell: pwsh
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = $env:EXPECTED_REVISION.Trim().ToLowerInvariant()
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          $qualified = ($env:TIBOTATTLE_QUALIFICATION_REVISION ?? '').Trim().ToLowerInvariant()
          if ($expected -notmatch '^[0-9a-f]{40}$' -or $actual -ne $expected -or $qualified -ne $actual) {
            Write-Error 'WINDOWS_ELECTRON_REVISION_MISMATCH'
            exit 1
          }

      - name: Stage exact Windows x64 Electron development inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stagingLog = Join-Path $env:RUNNER_TEMP 'tibotattle-electron-staging.log'
          $stagedAppPath = Join-Path $env:GITHUB_WORKSPACE '.release-build/electron-dev/windows-x64/app'
          $windowsBindingPath = Join-Path $env:GITHUB_WORKSPACE 'native/windows-filesystem/build/Release/windows_filesystem.node'
          $windowsManifestPath = "${windowsBindingPath}.manifest.json"
          if (-not (Test-Path -LiteralPath $windowsBindingPath -PathType Leaf) -or
              -not (Test-Path -LiteralPath $windowsManifestPath -PathType Leaf)) {
            Write-Error 'WINDOWS_ELECTRON_BINDING_PAIR_MISSING'
            exit 1
          }
          node ./scripts/build-electron-app.mjs `
            --target win32 `
            --output $stagedAppPath `
            --replace `
            --windows-binding $windowsBindingPath `
            --windows-manifest $windowsManifestPath *> $stagingLog
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'WINDOWS_ELECTRON_STAGING_FAILED'
            exit 1
          }
          $runtimeManifestPath = Join-Path $stagedAppPath 'electron-runtime-manifest.json'
          if (-not (Test-Path -LiteralPath $runtimeManifestPath -PathType Leaf)) {
            Write-Error 'WINDOWS_ELECTRON_RUNTIME_MANIFEST_MISSING'
            exit 1
          }
          try {
            $runtimeManifest = Get-Content -LiteralPath $runtimeManifestPath -Raw | ConvertFrom-Json
            $nativeManifest = Get-Content -LiteralPath $windowsManifestPath -Raw | ConvertFrom-Json
          } catch {
            Write-Error 'WINDOWS_ELECTRON_RUNTIME_MANIFEST_INVALID'
            exit 1
          }
          if ($runtimeManifest.target -ne 'win32' -or
              $runtimeManifest.architecture -ne 'x64' -or
              $runtimeManifest.windowsBinding.status -ne 'included_unverified' -or
              $runtimeManifest.windowsBinding.verified -ne $false -or
              $runtimeManifest.windowsBinding.binding.bytes -ne $nativeManifest.bytes -or
              $runtimeManifest.windowsBinding.binding.sha256 -ne $nativeManifest.sha256 -or
              $nativeManifest.bytes.ToString() -ne $env:TIBOTATTLE_WINDOWS_BINDING_BYTES -or
              $nativeManifest.sha256 -ne $env:TIBOTATTLE_WINDOWS_BINDING_SHA256) {
            Write-Error 'WINDOWS_ELECTRON_BINDING_INPUT_MISMATCH'
            exit 1
          }
          "TIBOTATTLE_ELECTRON_STAGED_APP_PATH=$stagedAppPath" >> $env:GITHUB_ENV
          "TIBOTATTLE_ELECTRON_WINDOWS_BINDING_PATH=$windowsBindingPath" >> $env:GITHUB_ENV
          "TIBOTATTLE_ELECTRON_WINDOWS_MANIFEST_PATH=$windowsManifestPath" >> $env:GITHUB_ENV

      - name: Build unsigned Windows x64 Electron directory artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $builderVersionLog = Join-Path $env:RUNNER_TEMP 'tibotattle-electron-builder-version.log'
          $builderLog = Join-Path $env:RUNNER_TEMP 'tibotattle-electron-builder.log'
          pnpm exec electron-builder --version *> $builderVersionLog
          if ($LASTEXITCODE -ne 0 -or (Get-Content -LiteralPath $builderVersionLog -Raw).Trim() -ne '26.15.7') {
            Write-Error 'WINDOWS_ELECTRON_BUILDER_VERSION_MISMATCH'
            exit 1
          }
          $env:TIBOTATTLE_ELECTRON_TARGET = 'win32'
          pnpm exec electron-builder `
            --config apps/electron/electron-builder.config.cjs `
            --win dir `
            --x64 `
            --publish never *> $builderLog
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'WINDOWS_ELECTRON_DIRECTORY_BUILD_FAILED'
            exit 1
          }
          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE '.release-build/electron-dev/windows-x64/artifacts'
          $artifactAppPath = Join-Path $artifactRoot 'win-unpacked'
          $asarPath = Join-Path $artifactAppPath 'resources/app.asar'
          $unpackedPath = Join-Path $artifactAppPath 'resources/app.asar.unpacked'
          if (-not (Test-Path -LiteralPath $artifactAppPath -PathType Container) -or
              -not (Test-Path -LiteralPath $asarPath -PathType Leaf) -or
              -not (Test-Path -LiteralPath $unpackedPath -PathType Container)) {
            Write-Error 'WINDOWS_ELECTRON_DIRECTORY_ARTIFACT_MISSING'
            exit 1
          }
          $topLevelInstallers = @(Get-ChildItem -LiteralPath $artifactRoot -File -Force |
            Where-Object { $_.Name -match '\.(?:exe|msi|msix|appx|zip|7z|nsis)$' })
          if ($topLevelInstallers.Count -ne 0) {
            Write-Error 'WINDOWS_ELECTRON_INSTALLER_OUTPUT_UNEXPECTED'
            exit 1
          }
          "TIBOTATTLE_ELECTRON_ARTIFACT_APP_PATH=$artifactAppPath" >> $env:GITHUB_ENV
          "TIBOTATTLE_ELECTRON_ASAR_PATH=$asarPath" >> $env:GITHUB_ENV
          "TIBOTATTLE_ELECTRON_UNPACKED_PATH=$unpackedPath" >> $env:GITHUB_ENV

      - name: Verify Windows Electron development artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $verificationLog = Join-Path $env:RUNNER_TEMP 'tibotattle-electron-verification.json'
          node ./scripts/verify-electron-development-artifact.mjs `
            --target win32-x64 `
            --app $env:TIBOTATTLE_ELECTRON_STAGED_APP_PATH `
            --asar $env:TIBOTATTLE_ELECTRON_ASAR_PATH `
            --unpacked $env:TIBOTATTLE_ELECTRON_UNPACKED_PATH *> $verificationLog
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'WINDOWS_ELECTRON_ARTIFACT_VERIFICATION_FAILED'
            exit 1
          }
          "TIBOTATTLE_ELECTRON_VERIFICATION_EVIDENCE_PATH=$verificationLog" >> $env:GITHUB_ENV
          try {
            $evidence = Get-Content -LiteralPath $verificationLog -Raw | ConvertFrom-Json
          } catch {
            Write-Error 'WINDOWS_ELECTRON_ARTIFACT_EVIDENCE_INVALID'
            exit 1
          }
          $evidenceJson = $evidence | ConvertTo-Json -Depth 10 -Compress
          if ($evidence.status -ne 'ELECTRON_DEVELOPMENT_ARTIFACT_VERIFIED' -or
              $evidence.target -ne 'win32-x64' -or
              $evidence.nativeFileCount -ne 2 -or
              $evidence.binding.status -ne 'included_unverified' -or
              $evidence.binding.bytes -ne [int64]$env:TIBOTATTLE_WINDOWS_BINDING_BYTES -or
              $evidence.binding.sha256 -ne $env:TIBOTATTLE_WINDOWS_BINDING_SHA256 -or
              $evidenceJson -match '(?i)(?:[A-Za-z]:[\\/]|/Users/|/home/|\\Users\\|password|secret|token|credential)') {
            Write-Error 'WINDOWS_ELECTRON_ARTIFACT_EVIDENCE_NOT_CONTENT_FREE'
            exit 1
          }
          foreach ($name in @('staged', 'asar', 'unpacked', 'artifact')) {
            $inventory = $evidence.$name
            if ($null -eq $inventory -or
                (($inventory.count -isnot [int]) -and ($inventory.count -isnot [long])) -or
                (($inventory.bytes -isnot [int]) -and ($inventory.bytes -isnot [long])) -or
                $inventory.count -lt 0 -or
                $inventory.bytes -lt 0 -or
                $inventory.sha256 -notmatch '^[0-9a-f]{64}$') {
              Write-Error 'WINDOWS_ELECTRON_ARTIFACT_INVENTORY_INVALID'
              exit 1
            }
          }
          "### Windows Electron development artifact" >> $env:GITHUB_STEP_SUMMARY
          "- Status: $($evidence.status)" >> $env:GITHUB_STEP_SUMMARY
          "- Target: $($evidence.target)" >> $env:GITHUB_STEP_SUMMARY
          "- Checked-out revision: $env:TIBOTATTLE_QUALIFICATION_REVISION" >> $env:GITHUB_STEP_SUMMARY
          "- Packaging: unsigned directory target only; publication disabled" >> $env:GITHUB_STEP_SUMMARY
          "- Native file count: $($evidence.nativeFileCount)" >> $env:GITHUB_STEP_SUMMARY
          "- Staged files: $($evidence.staged.count); bytes: $($evidence.staged.bytes); SHA-256: $($evidence.staged.sha256)" >> $env:GITHUB_STEP_SUMMARY
          "- app.asar files: $($evidence.asar.count); bytes: $($evidence.asar.bytes); SHA-256: $($evidence.asar.sha256)" >> $env:GITHUB_STEP_SUMMARY
          "- app.asar.unpacked files: $($evidence.unpacked.count); bytes: $($evidence.unpacked.bytes); SHA-256: $($evidence.unpacked.sha256)" >> $env:GITHUB_STEP_SUMMARY
          "- Artifact union files: $($evidence.artifact.count); bytes: $($evidence.artifact.bytes); SHA-256: $($evidence.artifact.sha256)" >> $env:GITHUB_STEP_SUMMARY
          "- Binding bytes: $($evidence.binding.bytes); SHA-256: $($evidence.binding.sha256)" >> $env:GITHUB_STEP_SUMMARY
          "- Runtime qualification: deferred to the native Windows Electron smoke step" >> $env:GITHUB_STEP_SUMMARY
          "- Windows production readiness: not claimed" >> $env:GITHUB_STEP_SUMMARY
          "- Signing, notarization, installer, updater, and publication: not performed" >> $env:GITHUB_STEP_SUMMARY

      - name: Run Windows Electron x64 runtime smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimeEvidencePath = Join-Path $env:RUNNER_TEMP 'tibotattle-windows-electron-runtime-smoke.json'
          node ./scripts/smoke-electron-windows.mjs *> $runtimeEvidencePath
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'WINDOWS_ELECTRON_RUNTIME_SMOKE_FAILED'
            exit 1
          }
          try {
            $runtimeEvidence = Get-Content -LiteralPath $runtimeEvidencePath -Raw | ConvertFrom-Json
          } catch {
            Write-Error 'WINDOWS_ELECTRON_RUNTIME_SMOKE_EVIDENCE_INVALID'
            exit 1
          }
          $runtimeJson = $runtimeEvidence | ConvertTo-Json -Depth 10 -Compress
          $requiredChecks = @(
            'artifact',
            'dashboardReady',
            'credentialPersistence',
            'syntheticRefresh',
            'secondInstanceRejected',
            'showHideTrayLifecycle',
            'cleanQuit',
            'noOrphan',
            'statePersistence',
            'relaunchPersistence'
          )
          if ($runtimeEvidence.status -ne 'passed' -or
              $runtimeEvidence.target -ne 'win32-x64' -or
              $runtimeEvidence.contentFree -ne $true -or
              $runtimeJson -match '(?i)(?:[A-Za-z]:[\\/]|/Users/|/home/|\\Users\\|username|password|secret|token|pid|process|stdout|stderr|command|executable)') {
            Write-Error 'WINDOWS_ELECTRON_RUNTIME_SMOKE_EVIDENCE_NOT_CONTENT_FREE'
            exit 1
          }
          foreach ($check in $requiredChecks) {
            if ($runtimeEvidence.$check -ne $true) {
              Write-Error 'WINDOWS_ELECTRON_RUNTIME_SMOKE_CHECK_FAILED'
              exit 1
            }
          }
          "TIBOTATTLE_ELECTRON_RUNTIME_SMOKE_EVIDENCE_PATH=$runtimeEvidencePath" >> $env:GITHUB_ENV
          "### Windows Electron runtime smoke" >> $env:GITHUB_STEP_SUMMARY
          "- Status: $($runtimeEvidence.status)" >> $env:GITHUB_STEP_SUMMARY
          "- Target: $($runtimeEvidence.target)" >> $env:GITHUB_STEP_SUMMARY
          "- Dashboard readiness: passed" >> $env:GITHUB_STEP_SUMMARY
          "- Synthetic refresh: passed" >> $env:GITHUB_STEP_SUMMARY
          "- Tray/window lifecycle: passed" >> $env:GITHUB_STEP_SUMMARY
          "- Single-instance rejection: passed" >> $env:GITHUB_STEP_SUMMARY
          "- Clean quit and no orphan: passed" >> $env:GITHUB_STEP_SUMMARY
          "- Relaunch persistence: passed" >> $env:GITHUB_STEP_SUMMARY
          "- Protected state persistence: passed" >> $env:GITHUB_STEP_SUMMARY
          "- Disposable Credential Manager persistence and cleanup: passed" >> $env:GITHUB_STEP_SUMMARY
          "- Diagnostics: content-free" >> $env:GITHUB_STEP_SUMMARY

      - name: Create content-free Windows Electron qualification receipt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $receiptPath = Join-Path $env:RUNNER_TEMP 'tibotattle-windows-electron-qualification-receipt.json'
          node ./scripts/build-windows-electron-qualification-receipt.mjs `
            --output $receiptPath `
            --revision $env:TIBOTATTLE_QUALIFICATION_REVISION `
            --target win32-x64 `
            --cache-mode $env:TIBOTATTLE_QUALIFICATION_CACHE_MODE `
            --binding-sha256 $env:TIBOTATTLE_WINDOWS_BINDING_SHA256 `
            --binding-bytes $env:TIBOTATTLE_WINDOWS_BINDING_BYTES `
            --qualification-result $env:TIBOTATTLE_WINDOWS_SECURITY_QUALIFICATION_RESULT_PATH `
            --packaged-evidence $env:TIBOTATTLE_ELECTRON_VERIFICATION_EVIDENCE_PATH `
            --runtime-evidence $env:TIBOTATTLE_ELECTRON_RUNTIME_SMOKE_EVIDENCE_PATH
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'WINDOWS_ELECTRON_QUALIFICATION_RECEIPT_FAILED'
            exit 1
          }
          try {
            $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
          } catch {
            Write-Error 'WINDOWS_ELECTRON_QUALIFICATION_RECEIPT_INVALID'
            exit 1
          }
          $receiptJson = $receipt | ConvertTo-Json -Depth 20 -Compress
          if ($receipt.status -ne 'WINDOWS_ELECTRON_DEVELOPMENT_QUALIFICATION_PASSED' -or
              $receipt.schemaVersion -ne 'tibotattle-windows-electron-development-qualification-v1' -or
              $receipt.target -ne 'win32-x64' -or
              $receipt.mode -ne 'qualification_only' -or
              $receipt.productionReadiness -ne 'not_claimed' -or
              $receipt.revision -ne $env:TIBOTATTLE_QUALIFICATION_REVISION -or
              $receipt.cacheMode -ne $env:TIBOTATTLE_QUALIFICATION_CACHE_MODE -or
              $receiptJson -match '(?i)(?:[A-Za-z]:[\\/]|/Users/|/home/|\\Users\\|username|password|secret|token|pid|stdout|stderr|command|executable)') {
            Write-Error 'WINDOWS_ELECTRON_QUALIFICATION_RECEIPT_NOT_CONTENT_FREE'
            exit 1
          }
          "TIBOTATTLE_ELECTRON_QUALIFICATION_RECEIPT_PATH=$receiptPath" >> $env:GITHUB_ENV
          "### Windows Electron qualification receipt" >> $env:GITHUB_STEP_SUMMARY
          "- Status: $($receipt.status)" >> $env:GITHUB_STEP_SUMMARY
          "- Revision: $($receipt.revision)" >> $env:GITHUB_STEP_SUMMARY
          "- Target: $($receipt.target)" >> $env:GITHUB_STEP_SUMMARY
          "- Cache mode: $($receipt.cacheMode)" >> $env:GITHUB_STEP_SUMMARY
          "- Mode: qualification only; production readiness: not claimed" >> $env:GITHUB_STEP_SUMMARY
          "- Binding bytes: $($receipt.binding.bytes); SHA-256: $($receipt.binding.sha256)" >> $env:GITHUB_STEP_SUMMARY
          "- Runtime and package evidence: aggregate-only" >> $env:GITHUB_STEP_SUMMARY

      - name: Retain exact Windows x64 development artifact and qualification receipt
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tibotattle-windows-x64-electron-${{ github.sha }}-${{ matrix.cache-mode }}
          path: |
            ${{ env.TIBOTATTLE_ELECTRON_ARTIFACT_APP_PATH }}
            ${{ env.TIBOTATTLE_ELECTRON_QUALIFICATION_RECEIPT_PATH }}
          if-no-files-found: error
          retention-days: 3

      - name: Remove generated Electron artifact tree before clean checkout gate
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseBuild = Join-Path $env:GITHUB_WORKSPACE '.release-build'
          if (Test-Path -LiteralPath $releaseBuild) {
            Remove-Item -LiteralPath $releaseBuild -Recurse -Force
          }

      - name: Confirm qualification and artifact work did not modify the checkout
        if: ${{ always() }}
        shell: pwsh
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = $env:EXPECTED_REVISION.Trim().ToLowerInvariant()
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($expected -notmatch '^[0-9a-f]{40}$' -or $actual -ne $expected) {
            Write-Error 'WINDOWS_QUALIFICATION_REVISION_MISMATCH'
            exit 1
          }
          git diff --quiet
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'WINDOWS_QUALIFICATION_WORKTREE_DIRTY'
            exit 1
          }
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'WINDOWS_QUALIFICATION_INDEX_DIRTY'
            exit 1
          }
          $untracked = git ls-files --others --exclude-standard
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'WINDOWS_QUALIFICATION_UNTRACKED_CHECK_FAILED'
            exit 1
          }
          if ($null -ne $untracked -and $untracked.Count -gt 0) {
            Write-Error 'WINDOWS_QUALIFICATION_UNTRACKED_OUTPUT'
            exit 1
          }
