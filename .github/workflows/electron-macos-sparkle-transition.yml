          intake={'schemaVersion':'tibotattle-native-sparkle-test-intake-v1','sourceRevision':source,
            'target':target,'feedScope':scope,'version':'0.1.21','buildNumber':e['SELECTED_BUILD'],'bundleVersion':'1028',
